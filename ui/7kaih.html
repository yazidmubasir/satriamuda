<script>
(function(){
  const ORIGINAL_MODULE_PAGE=window.modulePage;
  const ORIGINAL_LOAD_MODULE_DATA=window.loadModuleData;
  const ORIGINAL_DASHBOARD_ROW=window.renderDashboardRow;
  const HABITS=[
    {id:'bangunPagi',icon:'🌅',name:'Bangun Pagi',tip:'Mulai hari dengan disiplin dan kesiapan.'},
    {id:'beribadah',icon:'🙏',name:'Beribadah',tip:'Menguatkan rasa syukur, nilai moral, dan spiritual.'},
    {id:'berolahraga',icon:'🏃',name:'Berolahraga',tip:'Menjaga kebugaran tubuh dan ketahanan diri.'},
    {id:'makanSehat',icon:'🥗',name:'Makan Sehat dan Bergizi',tip:'Memilih asupan yang baik untuk tubuh dan pikiran.'},
    {id:'gemarBelajar',icon:'📚',name:'Gemar Belajar',tip:'Menemukan pengetahuan, ide, dan keterampilan baru.'},
    {id:'bermasyarakat',icon:'🤝',name:'Bermasyarakat',tip:'Berbagi, bekerja sama, peduli, dan menghargai sesama.'},
    {id:'tidurCepat',icon:'🌙',name:'Tidur Cepat',tip:'Beristirahat cukup agar siap menjalani hari berikutnya.'}
  ];
  function esc7(v){return typeof esc==='function'?esc(v):String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));}
  function today7(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
  function statusValue(id){return document.getElementById('mf_'+id)?.value||''}
  function updateScore7(){
    const done=HABITS.filter(h=>statusValue(h.id)==='Sudah').length;
    const pct=Math.round(done/7*100);
    const score=document.getElementById('sevenScore'),pctEl=document.getElementById('sevenPercent'),ring=document.getElementById('sevenRing'),bar=document.getElementById('sevenProgressBar');
    if(score)score.textContent=done+' / 7';
    if(pctEl)pctEl.textContent=pct+'%';
    if(ring)ring.style.setProperty('--pct',pct*3.6+'deg');
    if(bar)bar.style.width=pct+'%';
    const hiddenScore=document.getElementById('mf_skorHarian'),hiddenPct=document.getElementById('mf_persentaseKebiasaan');
    if(hiddenScore)hiddenScore.value=done+' / 7';
    if(hiddenPct)hiddenPct.value=pct+'%';
    const summary=document.getElementById('sevenSummary');
    if(summary)summary.textContent=pct===100?'🌟 Lengkap! Semua kebiasaan hari ini tercatat.':pct>=71?'✨ Mantap! Tinggal sedikit lagi.':pct>=43?'🌱 Terus tumbuh, satu kebiasaan demi satu.':'💜 Tidak apa-apa. Mulai dari satu kebiasaan hari ini.';
  }
  function render7KAIH(){
    const form=document.getElementById('moduleForm');if(!form)return;
    form.innerHTML=`
      <div class="s7-shell">
        <section class="s7-intro"><div class="s7-intro-icon">🌱</div><div class="s7-intro-copy"><div class="s7-kicker">JURNAL PEMBIASAAN HARIAN</div><h2>Jejak 7 Kebiasaan Hari Ini</h2><p>Catat dengan jujur, sederhana, dan menggembirakan. Ini adalah ruang refleksi diri, bukan perlombaan nilai.</p></div></section>
        <div class="s7-resource-row"><a href="https://cerdasberkarakter.kemendikdasmen.go.id/gerakan7kebiasaan/" target="_blank" rel="noopener">📖 Pelajari 7KAIH resmi <span>↗</span></a><a href="https://cerdasberkarakter.kemendikdasmen.go.id/wp-content/uploads/2025/04/BUKU-PANDUAN-PENERAPAN-GERAKAN-7KAIH-JENJANG-SMA.pdf" target="_blank" rel="noopener">📘 Panduan SMA/SMK <span>↗</span></a></div>
        <section class="s7-progress-card"><div class="s7-date-box"><label for="mf_tanggal">Tanggal pembiasaan</label><input id="mf_tanggal" type="date" value="${today7()}"><small>Catat kebiasaan yang benar-benar kamu lakukan hari ini.</small></div><div class="s7-score-box"><div class="s7-ring" id="sevenRing"><div><strong id="sevenScore">0 / 7</strong><small id="sevenPercent">0%</small></div></div><div class="s7-score-copy"><span>Jejak Kebiasaan</span><strong id="sevenSummary">💜 Mulai dari satu kebiasaan hari ini.</strong></div></div></section>
        <div class="s7-progress-track"><div id="sevenProgressBar"></div></div>
        <div class="s7-section-head"><div><span>🌱</span><div><h3>Tujuh Kebiasaan</h3><p>Pilih status yang paling sesuai dengan kondisi hari ini.</p></div></div><span class="s7-count">7 kebiasaan</span></div>
        <section class="s7-habit-grid">${HABITS.map((h,i)=>`<article class="s7-habit-card"><div class="s7-habit-top"><div class="s7-habit-number">0${i+1}</div><div class="s7-habit-icon">${h.icon}</div><div class="s7-habit-title"><h4>${h.name}</h4><p>${h.tip}</p></div></div><select id="mf_${h.id}" onchange="window.__update7KAIH()" aria-label="Status ${esc7(h.name)}"><option value="">Pilih status</option><option value="Sudah">✓ Sudah dilakukan</option><option value="Belum">○ Belum dilakukan</option></select></article>`).join('')}</section>
        <section class="s7-reflection"><div class="s7-section-head"><div><span>💭</span><div><h3>Cerita & Refleksi</h3><p>Satu langkah kecil yang kamu sadari hari ini sudah berarti.</p></div></div></div><div class="s7-form-grid"><div class="s7-field s7-wide"><label for="mf_uraian">Cerita / Bukti Pembiasaan</label><textarea id="mf_uraian" placeholder="Ceritakan satu momen kecil hari ini yang paling membanggakan atau bermakna."></textarea></div><div class="s7-field"><label for="mf_nilaiKarakter">Nilai / Karakter yang Terasa</label><input id="mf_nilaiKarakter" placeholder="Disiplin, mandiri, peduli, tanggung jawab..." /></div><div class="s7-field"><label for="mf_targetBesok">🎯 Target Kebiasaan Besok</label><textarea id="mf_targetBesok" placeholder="Satu kebiasaan yang ingin kamu kuatkan besok..."></textarea></div><div class="s7-field s7-wide"><label for="mf_refleksi">Refleksi Hari Ini</label><textarea id="mf_refleksi" placeholder="Apa yang sudah baik? Apa yang ingin kamu perbaiki besok?"></textarea></div></div></section>
        <input id="mf_kegiatan" type="hidden" value="7 Kebiasaan Anak Indonesia Hebat"><input id="mf_kategori" type="hidden" value="Jurnal Pembiasaan Harian"><input id="mf_skorHarian" type="hidden" value="0 / 7"><input id="mf_persentaseKebiasaan" type="hidden" value="0%">
      </div>`;
    HABITS.forEach(h=>{const el=document.getElementById('mf_'+h.id);if(el)el.value='';});window.__update7KAIH=updateScore7;updateScore7();
  }
  function formatDate7(v){if(!v)return'-';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});}
  function render7History(rows){
    const box=document.getElementById('moduleTable');if(!box)return;
    if(!rows||!rows.length){box.innerHTML='<div class="s7-empty"><div>🌱</div><strong>Belum ada jejak 7KAIH</strong><span>Setelah menyimpan pembiasaan hari ini, riwayatnya akan muncul di sini.</span></div>';return;}
    box.innerHTML=`<div class="s7-history">${rows.map(r=>{const pct=String(r.persentaseKebiasaan||'0%'),done=String(r.skorHarian||'0 / 7');return `<article class="s7-history-card"><div class="s7-history-head"><div><span class="s7-history-date">${esc7(formatDate7(r.tanggal||r.timestamp))}</span><strong>${esc7(done)}</strong><small> kebiasaan berhasil</small></div><span class="s7-history-pct">${esc7(pct)}</span></div><div class="s7-dots">${HABITS.map((h,i)=>`<span class="${r[h.id]==='Sudah'?'done':r[h.id]==='Belum'?'miss':'empty'}" title="${esc7(HABITS[i].name)}"></span>`).join('')}</div><div class="s7-history-grid"><div><small>Nilai yang terasa</small><p>${esc7(r.nilaiKarakter||'—')}</p></div><div><small>Target besok</small><p>${esc7(r.targetBesok||'—')}</p></div></div><div class="s7-history-reflection">${esc7(r.refleksi||r.uraian||'Belum ada refleksi.')}</div><button class="s7-delete" type="button" onclick='window.__delete7KAIH(${JSON.stringify(String(r.id||''))})'>Hapus</button></article>`;}).join('')}</div>`;
  }
  function load7Data(){google.script.run.withSuccessHandler(render7History).withFailureHandler(showError).getSiswaModuleData('TUJUHKAIH');}
  window.__delete7KAIH=function(id){if(!id||!confirm('Hapus jejak 7KAIH ini?'))return;google.script.run.withSuccessHandler(load7Data).withFailureHandler(showError).deleteSiswaModule('TUJUHKAIH',id);};
  function page7(){const cfg=(APP.menus||[]).find(m=>m.kode==='TUJUHKAIH');if(!cfg)return;document.getElementById('content').innerHTML=`<div class="card s7-page"><div class="s7-page-title"><div class="s7-page-icon">🌱</div><div><h1>Kegiatan 7KAIH</h1><p>Bangun Pagi · Beribadah · Berolahraga · Makan Sehat dan Bergizi · Gemar Belajar · Bermasyarakat · Tidur Cepat</p></div></div><div id="moduleForm"><div class="loading">Menyiapkan jurnal 7KAIH...</div></div><div class="s7-save-wrap"><button class="btn s7-save" id="saveModuleBtn" onclick="saveModule('TUJUHKAIH')">Simpan Jejak 7KAIH</button></div></div><div class="card s7-history-page"><div class="s7-history-title"><div><h2>🌱 Jejak Saya</h2><p>Riwayat pembiasaan yang sudah kamu catat.</p></div></div><div id="moduleTable" class="loading">Memuat...</div></div>`;render7KAIH();load7Data();}
  window.loadModuleData=function(kode){if(kode==='TUJUHKAIH')load7Data();else if(typeof ORIGINAL_LOAD_MODULE_DATA==='function')ORIGINAL_LOAD_MODULE_DATA(kode);};
  window.modulePage=function(kode){if(kode==='TUJUHKAIH')page7();else if(typeof ORIGINAL_MODULE_PAGE==='function')ORIGINAL_MODULE_PAGE(kode);};
  window.renderDashboardRow=function(kode,r){if(kode!=='TUJUHKAIH'&&typeof ORIGINAL_DASHBOARD_ROW==='function')return ORIGINAL_DASHBOARD_ROW(kode,r);if(kode!=='TUJUHKAIH')return '';const tanggal=r.tanggal?formatDashboardDate(r.tanggal):'',kelas=r.namaKelas||r.idKelas||'-',siswa=r.nama||r.email||'-',score=r.persentaseKebiasaan||r.skorHarian||'0%',cerita=r.uraian||r.refleksi||'Jejak pembiasaan 7KAIH';return `<div class="dashboardRow"><div class="dashboardRowTop"><strong>🌱 ${esc7(score)} • 7KAIH</strong><span>${esc7(tanggal)}</span></div><div class="dashboardRowSub">${esc7(cerita)}</div><div class="dashboardRowFoot"><span>👤 ${esc7(siswa)}</span><span>🏫 ${esc7(kelas)}</span></div></div>`;};
})();
</script>
