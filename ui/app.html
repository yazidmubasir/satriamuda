<script>
let APP={session:{},setup:{},kelas:[],menus:[],menuGroups:[]};
const SATRIA_WEBAPP_URL='https://script.google.com/macros/s/AKfycbz1zboolon4Y6cCtOU3og4SS3VOHU1X3YAHEs1MWwU_0ftRo3f4I3fiRNq9rWQr3TJJ/exec';
window.addEventListener('load',showLoginScreen);
function showLoginScreen(){const b=document.getElementById('logoutBtn');if(b)b.style.display='none';document.getElementById('userBadge').innerHTML='';document.getElementById('moduleNav').innerHTML='';document.getElementById('adminNav').innerHTML='';document.getElementById('ownerNav').innerHTML='';document.getElementById('content').innerHTML=`<section class="loginScreen"><div class="loginGlow glowOne"></div><div class="loginGlow glowTwo"></div><div class="loginCard"><div class="loginLogo">S</div><div class="loginBrand">SATRIA MUDA</div><div class="loginTagline">Mulia . Berakhlak | Hebat . Berkarya</div><div class="loginDivider"></div><h1>Selamat Datang</h1><p>Masuk menggunakan akun Google sekolah untuk melanjutkan ke sistem SATRIA MUDA.</p><button class="googleLogin" onclick="loginWithGoogle()"><span class="googleMark">G</span><span>Masuk dengan Akun Google</span></button><div class="loginHint">Gunakan akun Google yang telah terdaftar pada SATRIA MUDA.</div></div></section>`}
function loginWithGoogle(){const b=document.querySelector('.googleLogin');if(b){b.disabled=true;b.classList.add('loadingBtn');b.innerHTML='<span class="loginSpinner"></span><span>Memeriksa akun Google...</span>'}google.script.run.withSuccessHandler(init).withFailureHandler(e=>{if(b){b.disabled=false;b.classList.remove('loadingBtn');b.innerHTML='<span class="googleMark">G</span><span>Masuk dengan Akun Google</span>'}showError(e)}).getInitialData()}
function init(d){APP=d||{};const s=APP.session||{};if(!s.email||s.role==='UNKNOWN'){showUnauthorized(s);return}const b=document.getElementById('logoutBtn');if(b)b.style.display='grid';document.getElementById('userBadge').innerHTML=`<span class="badge">${esc(s.name||s.email||'Pengguna')} • ${esc(s.role||'UNKNOWN')}</span>`;renderStudentNav();document.getElementById('ownerNav').innerHTML='';document.getElementById('adminNav').innerHTML='';if(s.role==='ADMIN_KELAS')document.getElementById('adminNav').innerHTML='<div class="menu-separator"></div><button class="nav special" onclick="showPage(\'admin\')">👥 User Siswa</button>';if(s.role==='OWNER')document.getElementById('ownerNav').innerHTML='<div class="menu-separator"></div><button class="nav special" onclick="showPage(\'owner\')">⚙️ Pengaturan OWNER</button>';showPage('home')}
function logoutApp(){if(!confirm('Keluar dari SATRIA MUDA dan ganti akun Google?'))return;try{sessionStorage.clear();localStorage.removeItem('satriaMudaState');localStorage.clear();}catch(e){}APP={session:{},setup:{},kelas:[],menus:[],menuGroups:[]};const target=SATRIA_WEBAPP_URL+'?reauth=1';const googleLogout='https://accounts.google.com/Logout?continue='+encodeURIComponent(target);document.getElementById('content').innerHTML='<section class="loginScreen"><div class="loginCard accessCard"><div class="accessIcon">🔐</div><div class="loginBrand">KELUAR DARI SATRIA MUDA</div><h1>Menyiapkan login ulang...</h1><p>Sesi aplikasi sudah dihapus. Anda akan diarahkan ke autentikasi Google agar dapat masuk kembali dengan akun yang diinginkan.</p><div class="loading"><div class="loginSpinner"></div><div>Mohon tunggu...</div></div></div></section>';setTimeout(()=>{window.top.location.href=googleLogout},250)}
function showUnauthorized(s){const b=document.getElementById('logoutBtn');if(b)b.style.display='none';document.getElementById('userBadge').innerHTML='';document.getElementById('content').innerHTML=`<section class="loginScreen"><div class="loginCard accessCard"><div class="accessIcon">🔒</div><div class="loginBrand">AKUN BELUM TERDAFTAR</div><h1>Akses Belum Tersedia</h1><p>Akun Google <strong>${esc(s.email||'Anda')}</strong> belum terdaftar di SATRIA MUDA.</p><div class="notice accessNotice">Silakan hubungi <strong>ADMIN_KELAS</strong> untuk mendaftarkan akun Anda.</div><button class="btn secondary" onclick="showLoginScreen()">Kembali ke Halaman Masuk</button></div></section>`}
function renderStudentNav(){const groups=APP.menuGroups||[];document.getElementById('moduleNav').innerHTML=groups.map((g,i)=>`<div class="menu-group"><button class="nav parent-nav" onclick="toggleMenuGroup('group_${i}')"><span>${g.icon} ${esc(g.nama)}</span><span class="chevron" id="chev_group_${i}">▾</span></button><div class="submenu" id="group_${i}">${(g.items||[]).map(m=>`<button class="nav subnav" onclick="modulePage('${m.kode}')">${m.icon} ${esc(m.nama)}</button>`).join('')}</div></div>`).join('')}
function toggleMenuGroup(id){const el=document.getElementById(id),key='chev_'+id;if(!el)return;const open=el.classList.toggle('open');document.getElementById(key)?.classList.toggle('rotate',open)}
function showPage(p){document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));if(p==='home')home();if(p==='owner')owner();if(p==='admin')admin();if(p==='home'){document.querySelector('.home-nav')?.classList.add('active')}}
function home(){const c=document.getElementById('content');c.innerHTML=`<div class="card hero"><div class="title">Selamat datang di SATRIA MUDA</div><div class="muted">Mulia . Berakhlak | Hebat . Berkarya</div></div><div id="dashboardCards"><div class="card"><div class="loading">Memuat dashboard aktivitas...</div></div></div>`;google.script.run.withSuccessHandler(renderDashboard).withFailureHandler(e=>{c.querySelector('#dashboardCards').innerHTML='<div class="card"><div class="muted">Dashboard aktivitas belum dapat dimuat.</div></div>';showError(e)}).getDashboardData()}
function renderDashboard(data){const box=document.getElementById('dashboardCards');if(!box)return;const cards=data&&data.cards||[];if(!cards.length){box.innerHTML=`<div class="grid">${(APP.menuGroups||[]).map(g=>`<div class="card menu-card"><div class="title">${g.icon} ${esc(g.nama)}</div><p class="muted">${(g.items||[]).map(x=>esc(x.nama)).join(' • ')}</p><button class="btn" onclick="toggleMenuByCode('${g.kode}')">Buka ${esc(g.nama)}</button></div>`).join('')}</div>`;return}box.innerHTML=`<div class="dashboardIntro"><span>📊 Ringkasan Aktivitas</span><small>Seluruh kelas • diperbarui ${data.updatedAt?new Date(data.updatedAt).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}):'sekarang'}</small></div><div class="dashboardGrid">${cards.map(renderDashboardCard).join('')}</div>`}
function renderDashboardCard(card){const rows=card.rows||[];return `<article class="dashboardCard"><div class="dashboardCardHead"><div class="dashboardIcon">${card.icon}</div><div><div class="dashboardTitle">${esc(card.nama)}</div><div class="dashboardMeta">${card.total||0} data • ${card.kelasCount||0} kelas</div></div></div><div class="dashboardRows">${rows.length?rows.slice(0,6).map(r=>renderDashboardRow(card.kode,r)).join(''):'<div class="dashboardEmpty">Belum ada data.</div>'}</div><button class="dashboardOpen" onclick="modulePage('${card.kode}')">Buka ${esc(card.nama)} →</button></article>`}
function renderDashboardRow(kode,r){const tanggal=r.tanggal?formatDashboardDate(r.tanggal):'';const kelas=r.namaKelas||r.idKelas||'-';const siswa=r.nama||r.email||'-';let main='',sub='';if(kode==='AGENDA_BELAJAR'){main=r.materi||r.kegiatan||'Agenda Belajar';sub=[r.namaGuru,r.mataPelajaran].filter(Boolean).join(' • ')}else if(kode==='TUJUHKAIH'){main=r.kegiatan||r.uraian||'Kegiatan 7KAIH';sub=r.kategori||r.nilaiKarakter||''}else if(kode==='BELAJAR_MANDIRI'){main=r.materi||'Belajar Mandiri';sub=r.mataPelajaran||r.sumberBelajar||''}else if(kode==='JURNAL_REFLEKSI'){main=r.halDipelajari||'Jurnal Refleksi';sub=r.mataPelajaran||''}else if(kode==='PRESTASI'){main=r.namaPrestasi||'Prestasi Siswa';sub=[r.bidang,r.tingkat].filter(Boolean).join(' • ')}else if(kode==='LITERASI'){main=r.judul||'Kegiatan Literasi';sub=r.jenis||r.penulis||''}else if(kode==='ORGANISASI'){main=r.kegiatan||'Kegiatan Organisasi';sub=r.organisasi||r.jabatan||''}else{main=r.namaKegiatan||r.jenis||'Agenda Kegiatan';sub=r.tempat||''}return `<div class="dashboardRow"><div class="dashboardRowTop"><strong>${esc(main)}</strong><span>${esc(tanggal)}</span></div><div class="dashboardRowSub">${esc(sub||'')}</div><div class="dashboardRowFoot"><span>👤 ${esc(siswa)}</span><span>🏫 ${esc(kelas)}</span></div></div>`}
function formatDashboardDate(v){const d=new Date(v);return isNaN(d)?String(v):d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})}
function toggleMenuByCode(kode){const groups=APP.menuGroups||[];const i=groups.findIndex(g=>g.kode===kode);if(i<0)return;const id='group_'+i;const el=document.getElementById(id);if(el&&!el.classList.contains('open'))toggleMenuGroup(id);document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'nearest'})}
function modulePage(kode){const cfg=(APP.menus||[]).find(m=>m.kode===kode);if(!cfg)return;document.getElementById('content').innerHTML=`<div class="card"><div class="title">${cfg.icon} ${esc(cfg.nama)}</div><div class="muted">Isi kegiatan Anda lalu simpan. Data hanya dapat dihapus oleh pemiliknya.</div><br><div id="moduleForm"><div class="loading">Memuat formulir...</div></div><div class="actions"><button class="btn" id="saveModuleBtn" onclick="saveModule('${kode}')">Simpan ${esc(cfg.nama)}</button></div></div><div class="card"><h3>Data Saya</h3><div id="moduleTable" class="loading">Memuat...</div></div>`;loadModuleForm(kode);loadModuleData(kode)}
function loadModuleForm(kode){google.script.run.withSuccessHandler(cfg=>{if(kode==='AGENDA_BELAJAR'){google.script.run.withSuccessHandler(ref=>renderAgendaBelajarForm(cfg,ref)).withFailureHandler(showError).getAgendaBelajarReference();return}renderGenericModuleForm(cfg)}).withFailureHandler(showError).getModuleConfig(kode)}
function renderGenericModuleForm(cfg){document.getElementById('moduleForm').innerHTML=`<div class="grid">${cfg.fields.map(f=>renderModuleField(f)).join('')}</div>`}
function renderModuleField(f){const type=f[2];if(type==='selectGuru'||type==='selectMapel')return `<div class="field"><label>${esc(f[1])}</label><select id="mf_${f[0]}" disabled><option>Memuat pilihan...</option></select></div>`;return `<div class="field"><label>${esc(f[1])}</label>${type==='textarea'?`<textarea id="mf_${f[0]}" placeholder="${esc(f[1])}"></textarea>`:`<input id="mf_${f[0]}" type="${type==='date'?'date':'text'}" placeholder="${esc(f[1])}">`}</div>`}
function renderAgendaBelajarForm(cfg,ref){const gurus=ref.guru||[],mapel=ref.mapel||[];document.getElementById('moduleForm').innerHTML=`<div class="grid"><div class="field"><label>Tanggal</label><input id="mf_tanggal" type="date"></div><div class="field"><label>Nama Guru</label><select id="mf_namaGuru"><option value="">Pilih Nama Guru</option>${gurus.map(g=>`<option value="${esc(g.namaGuru)}" data-id="${esc(g.idGuru)}" data-nip="${esc(g.nip)}">${esc(g.namaGuru)}</option>`).join('')}</select></div><div class="field"><label>Mata Pelajaran</label><select id="mf_mataPelajaran"><option value="">Pilih Mata Pelajaran</option>${mapel.map(m=>`<option value="${esc(m.namaMapel)}">${esc(m.namaMapel)}</option>`).join('')}</select></div><div class="field"><label>Materi</label><input id="mf_materi" type="text" placeholder="Materi"></div><div class="field"><label>Tujuan Belajar</label><textarea id="mf_tujuanBelajar" placeholder="Tujuan Belajar"></textarea></div><div class="field"><label>Kegiatan Belajar</label><textarea id="mf_kegiatan" placeholder="Kegiatan Belajar"></textarea></div><div class="field"><label>Refleksi</label><textarea id="mf_refleksi" placeholder="Refleksi"></textarea></div></div>`}
function loadModuleData(kode){google.script.run.withSuccessHandler(rows=>{if(!rows.length){document.getElementById('moduleTable').innerHTML='<div class="muted">Belum ada data.</div>';return}const keys=Object.keys(rows[0]).filter(k=>!['id','timestamp','email','nisn','nama','idKelas','_rowNumber'].includes(k));document.getElementById('moduleTable').innerHTML='<div class="tableWrap"><table class="table"><tr>'+keys.map(k=>`<th>${esc(k)}</th>`).join('')+'<th>Aksi</th></tr>'+rows.map(r=>`<tr>${keys.map(k=>`<td>${esc(r[k])}</td>`).join('')}<td><button class="btn danger" onclick="delModule('${kode}','${esc(r.id)}')">Hapus</button></td></tr>`).join('')+'</table></div>'}).withFailureHandler(showError).getSiswaModuleData(kode)}
function resetAgendaBelajarForm_(){['tanggal','namaGuru','mataPelajaran','materi','tujuanBelajar','kegiatan','refleksi'].forEach(k=>{const el=document.getElementById('mf_'+k);if(el)el.value=''});const d=document.getElementById('mf_tanggal');if(d)d.value=new Date().toISOString().slice(0,10)}
function saveModule(kode){const fields=[...document.querySelectorAll('[id^="mf_"]')];const data={};fields.forEach(el=>data[el.id.substring(3)]=el.value);if(fields.some(el=>!el.value.trim()))return alert('Mohon lengkapi semua kolom.');const b=document.getElementById('saveModuleBtn');if(b){b.disabled=true;b.textContent='Menyimpan...'}const success=r=>{if(b){b.disabled=false;b.textContent='Simpan'}if(kode==='AGENDA_BELAJAR'){alert(r.message||'Agenda Belajar berhasil disimpan.');resetAgendaBelajarForm_();loadModuleData(kode);return}alert(r.message);modulePage(kode)};const fail=e=>{if(b){b.disabled=false;b.textContent='Simpan'}showError(e)};if(kode==='AGENDA_BELAJAR')google.script.run.withSuccessHandler(success).withFailureHandler(fail).saveAgendaBelajar(data);else google.script.run.withSuccessHandler(success).withFailureHandler(fail).saveSiswaModule(kode,data)}
function delModule(kode,id){if(!confirm('Hapus data ini?'))return;google.script.run.withSuccessHandler(()=>modulePage(kode)).withFailureHandler(showError).deleteSiswaModule(kode,id)}
function owner(){const x=APP.setup||{};document.getElementById('content').innerHTML=`<div class="card"><div class="title">⚙️ Pengaturan OWNER</div><div class="notice">Semua pengaturan utama dilakukan dari halaman ini.</div><div class="grid"><div class="field"><label>ID Spreadsheet MASTER_SIM</label><input id="masterId" value="${esc(x.masterSimId)}"></div><div class="field"><label>URL Gateway</label><input id="gatewayUrl" value="${esc(x.gatewayUrl)}"></div><div class="field"><label>Token Gateway</label><input id="gatewayToken" type="password" value="${esc(x.gatewayToken)}"></div><div class="field"><label>Email OWNER</label><input value="${esc(x.ownerEmail)}" disabled></div></div><button class="btn" onclick="saveOwner()">RUN — Simpan & Inisialisasi MASTER_SIM</button></div><div class="card"><h3>➕ Tambah / Update Kelas</h3><div class="grid"><div class="field"><label>ID Kelas</label><input id="idKelas" placeholder="X-1"></div><div class="field"><label>Nama Kelas</label><input id="namaKelas" placeholder="X IPA 1"></div></div><button class="btn" onclick="saveKelas()">Simpan Kelas</button></div>`;}
function saveOwner(){const data={masterSimId:document.getElementById('masterId').value,gatewayUrl:document.getElementById('gatewayUrl').value,gatewayToken:document.getElementById('gatewayToken').value};google.script.run.withSuccessHandler(r=>{alert(r.message||'Tersimpan');loginWithGoogle()}).withFailureHandler(showError).ownerSaveSetup(data)}
function saveKelas(){const data={idKelas:document.getElementById('idKelas').value,namaKelas:document.getElementById('namaKelas').value};google.script.run.withSuccessHandler(r=>{alert(r.message||'Tersimpan');owner()}).withFailureHandler(showError).ownerSaveKelas(data)}
</script>
