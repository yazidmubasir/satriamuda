<script>
let APP={session:{},setup:{},kelas:[],menus:[],menuGroups:[]};
window.addEventListener('load',()=>google.script.run.withSuccessHandler(init).withFailureHandler(showError).getInitialData());
function init(d){APP=d||{};const s=APP.session||{};document.getElementById('userBadge').innerHTML=`<span class="badge">${esc(s.name||s.email||'Pengguna')} • ${esc(s.role||'UNKNOWN')}</span>`;renderStudentNav();document.getElementById('ownerNav').innerHTML='';document.getElementById('adminNav').innerHTML='';if(s.role==='ADMIN_KELAS')document.getElementById('adminNav').innerHTML='<div class="menu-separator"></div><button class="nav special" onclick="showPage(\'admin\')">👥 User Siswa</button>';if(s.role==='OWNER')document.getElementById('ownerNav').innerHTML='<div class="menu-separator"></div><button class="nav special" onclick="showPage(\'owner\')">⚙️ Pengaturan OWNER</button>';showPage('home')}
function renderStudentNav(){const groups=APP.menuGroups||[];document.getElementById('moduleNav').innerHTML=groups.map((g,i)=>`<div class="menu-group"><button class="nav parent-nav" onclick="toggleMenuGroup('group_${i}')"><span>${g.icon} ${esc(g.nama)}</span><span class="chevron" id="chev_group_${i}">▾</span></button><div class="submenu" id="group_${i}">${(g.items||[]).map(m=>`<button class="nav subnav" onclick="modulePage('${m.kode}')">${m.icon} ${esc(m.nama)}</button>`).join('')}</div></div>`).join('')}
function toggleMenuGroup(id){const el=document.getElementById(id),key='chev_'+id;if(!el)return;const open=el.classList.toggle('open');document.getElementById(key)?.classList.toggle('rotate',open)}
function showPage(p){document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));if(p==='home')home();if(p==='owner')owner();if(p==='admin')admin();if(p==='home'){document.querySelector('.home-nav')?.classList.add('active')}}
function home(){document.getElementById('content').innerHTML=`<div class="card hero"><div class="title">Selamat datang di SATRIA SISWA</div><div class="muted">Platform kegiatan, pembiasaan, prestasi dan refleksi belajar siswa.</div></div><div class="grid">${(APP.menuGroups||[]).map(g=>`<div class="card menu-card"><div class="title">${g.icon} ${esc(g.nama)}</div><p class="muted">${(g.items||[]).map(x=>esc(x.nama)).join(' • ')}</p><button class="btn" onclick="toggleMenuByCode('${g.kode}')">Buka ${esc(g.nama)}</button></div>`).join('')}</div>`}
function toggleMenuByCode(kode){const groups=APP.menuGroups||[];const i=groups.findIndex(g=>g.kode===kode);if(i<0)return;const id='group_'+i;const el=document.getElementById(id);if(el&&!el.classList.contains('open'))toggleMenuGroup(id);document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'nearest'})}
function modulePage(kode){const cfg=(APP.menus||[]).find(m=>m.kode===kode);if(!cfg)return;document.getElementById('content').innerHTML=`<div class="card"><div class="title">${cfg.icon} ${esc(cfg.nama)}</div><div class="muted">Isi kegiatan Anda lalu simpan. Data hanya dapat dihapus oleh pemiliknya.</div><br><div id="moduleForm"></div><div class="actions"><button class="btn" id="saveModuleBtn" onclick="saveModule('${kode}')">Simpan ${esc(cfg.nama)}</button></div></div><div class="card"><h3>Data Saya</h3><div id="moduleTable" class="loading">Memuat...</div></div>`;loadModuleForm(kode);loadModuleData(kode)}
function loadModuleForm(kode){google.script.run.withSuccessHandler(cfg=>{document.getElementById('moduleForm').innerHTML=`<div class="grid">${cfg.fields.map(f=>`<div class="field"><label>${esc(f[1])}</label>${f[2]==='textarea'?`<textarea id="mf_${f[0]}" placeholder="${esc(f[1])}"></textarea>`:`<input id="mf_${f[0]}" type="${f[2]==='date'?'date':'text'}" placeholder="${esc(f[1])}">`}</div>`).join('')}</div>`}).withFailureHandler(showError).getModuleConfig(kode)}
function loadModuleData(kode){google.script.run.withSuccessHandler(rows=>{if(!rows.length){document.getElementById('moduleTable').innerHTML='<div class="muted">Belum ada data.</div>';return}const keys=Object.keys(rows[0]).filter(k=>!['id','timestamp','email','nisn','nama','idKelas','_rowNumber'].includes(k));document.getElementById('moduleTable').innerHTML='<div class="tableWrap"><table class="table"><tr>'+keys.map(k=>`<th>${esc(k)}</th>`).join('')+'<th>Aksi</th></tr>'+rows.map(r=>`<tr>${keys.map(k=>`<td>${esc(r[k])}</td>`).join('')}<td><button class="btn danger" onclick="delModule('${kode}','${esc(r.id)}')">Hapus</button></td></tr>`).join('')+'</table></div>'}).withFailureHandler(showError).getSiswaModuleData(kode)}
function saveModule(kode){const fields=[...document.querySelectorAll('[id^="mf_"]')];const data={};fields.forEach(el=>data[el.id.substring(3)]=el.value);if(fields.some(el=>!el.value.trim()))return alert('Mohon lengkapi semua kolom.');const b=document.getElementById('saveModuleBtn');b.disabled=true;b.textContent='Menyimpan...';google.script.run.withSuccessHandler(r=>{alert(r.message);modulePage(kode)}).withFailureHandler(e=>{b.disabled=false;b.textContent='Simpan';showError(e)}).saveSiswaModule(kode,data)}
function delModule(kode,id){if(!confirm('Hapus data ini?'))return;google.script.run.withSuccessHandler(()=>modulePage(kode)).withFailureHandler(showError).deleteSiswaModule(kode,id)}
function owner(){const x=APP.setup||{};document.getElementById('content').innerHTML=`<div class="card"><div class="title">⚙️ Pengaturan OWNER</div><div class="notice">Semua pengaturan utama dilakukan dari halaman ini.</div><div class="grid"><div class="field"><label>ID Spreadsheet MASTER_SIM</label><input id="masterId" value="${esc(x.masterSimId)}"></div><div class="field"><label>URL Gateway</label><input id="gatewayUrl" value="${esc(x.gatewayUrl)}"></div><div class="field"><label>Token Gateway</label><input id="gatewayToken" type="password" value="${esc(x.gatewayToken)}"></div><div class="field"><label>Email OWNER</label><input value="${esc(x.ownerEmail)}" disabled></div></div><button class="btn" onclick="saveOwner()">RUN — Simpan & Inisialisasi MASTER_SIM</button></div><div class="card"><h3>➕ Tambah / Update Kelas</h3><div class="grid"><div class="field"><label>ID Kelas</label><input id="idKelas" placeholder="X-1"></div><div class="field"><label>Nama Kelas</label><input id="namaKelas" placeholder="X IPA 1"></div><div class="field"><label>ID Spreadsheet MASTER_KELAS</label><input id="spreadsheetId"></div><div class="field"><label>ID Folder Drive</label><input id="folderId"></div><div class="field"><label>Email ADMIN_KELAS</label><input id="adminEmail"></div></div><button class="btn" onclick="saveKelas()">RUN — Simpan Kelas & Buat Sheet</button></div><div class="card"><h3>Kelas Terdaftar</h3><div class="tableWrap"><table class="table"><tr><th>ID</th><th>Kelas</th><th>Spreadsheet</th><th>Admin</th></tr>${(APP.kelas||[]).map(k=>`<tr><td>${esc(k.idKelas)}</td><td>${esc(k.namaKelas)}</td><td>${esc(k.spreadsheetId)}</td><td>${esc(k.adminEmail)}</td></tr>`).join('')}</table></div></div>`}
function saveOwner(){google.script.run.withSuccessHandler(r=>{alert(r.message);google.script.run.withSuccessHandler(init).getInitialData()}).withFailureHandler(showError).ownerSaveConfig({masterSimId:v('masterId'),gatewayUrl:v('gatewayUrl'),gatewayToken:v('gatewayToken')})}
function saveKelas(){google.script.run.withSuccessHandler(r=>{alert(r.message);google.script.run.withSuccessHandler(init).getInitialData()}).withFailureHandler(showError).ownerSaveKelas({idKelas:v('idKelas'),namaKelas:v('namaKelas'),spreadsheetId:v('spreadsheetId'),folderId:v('folderId'),adminEmail:v('adminEmail')})}
function admin(){document.getElementById('content').innerHTML=`<div class="card"><div class="title">👥 User Siswa</div><div class="grid"><div class="field"><label>ID User</label><input id="uid"></div><div class="field"><label>NISN</label><input id="nisn"></div><div class="field"><label>Nama</label><input id="unama"></div><div class="field"><label>Email Google</label><input id="uemail"></div></div><button class="btn" onclick="saveStudent()">RUN — Simpan User Siswa</button></div><div class="card"><h3>Daftar Siswa</h3><div id="students" class="loading">Memuat...</div></div>`;loadStudents()}
function saveStudent(){google.script.run.withSuccessHandler(r=>{alert(r.message);admin()}).withFailureHandler(showError).adminSaveStudent({idUser:v('uid'),nisn:v('nisn'),nama:v('unama'),email:v('uemail')})}
function loadStudents(){google.script.run.withSuccessHandler(rows=>{document.getElementById('students').innerHTML='<div class="tableWrap"><table class="table"><tr><th>ID</th><th>NISN</th><th>Nama</th><th>Email</th><th>Aksi</th></tr>'+rows.map(r=>`<tr><td>${esc(r.idUser)}</td><td>${esc(r.nisn)}</td><td>${esc(r.nama)}</td><td>${esc(r.email)}</td><td><button class="btn danger" onclick="delStudent('${esc(r.idUser)}')">Hapus</button></td></tr>`).join('')+'</table></div>'}).withFailureHandler(showError).adminListStudents()}
function delStudent(id){if(confirm('Hapus siswa?'))google.script.run.withSuccessHandler(()=>admin()).withFailureHandler(showError).deleteStudent(id)}
function v(id){return document.getElementById(id)?.value||''}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function showError(e){alert(e&&e.message?e.message:e)}
</script>
