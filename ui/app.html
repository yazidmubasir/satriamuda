<script>
let APP={session:{},setup:{},kelas:[]};
window.addEventListener('load',()=>google.script.run.withSuccessHandler(init).withFailureHandler(showError).getInitialData());
function init(d){APP=d||{};const s=APP.session||{};document.getElementById('userBadge').innerHTML=`<span class="badge">${esc(s.name||s.email||'Pengguna')} • ${esc(s.role||'UNKNOWN')}</span>`;if(s.role==='OWNER')document.getElementById('ownerNav').innerHTML='<button class="nav" onclick="showPage(\'owner\')">⚙️ Pengaturan OWNER</button>';if(s.role==='ADMIN_KELAS')document.getElementById('adminNav').innerHTML='<button class="nav" onclick="showPage(\'admin\')">👥 User Siswa</button>';showPage('home')}
function showPage(p){document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));if(p==='home')home();if(p==='agenda')agenda();if(p==='owner')owner();if(p==='admin')admin()}
function home(){document.getElementById('content').innerHTML=`<div class="card"><div class="title">Selamat datang di SATRIA SISWA</div><div class="muted">Platform kegiatan belajar siswa berbasis Google Apps Script.</div></div><div class="grid"><div class="card"><b>📚 Agenda Belajar</b><p class="muted">Catat rencana, kegiatan, dan refleksi belajar harian.</p><button class="btn" onclick="agenda()">Buka Agenda</button></div><div class="card"><b>🚀 Modul berikutnya</b><p class="muted">Kegiatan 7 Kebiasaan, Belajar Mandiri, Prestasi, dan modul siswa lainnya siap ditambahkan dengan pola yang sama.</p></div></div>`}
function agenda(){document.getElementById('content').innerHTML=`<div class="card"><div class="title">📚 Agenda Belajar</div><div class="muted">Input kegiatan belajar siswa.</div><br><div class="grid"><div class="field"><label>Tanggal</label><input id="abTanggal" type="date"></div><div class="field"><label>Mata Pelajaran</label><input id="abMapel" placeholder="Contoh: Fisika"></div></div><div class="field"><label>Materi</label><input id="abMateri" placeholder="Materi yang dipelajari"></div><div class="field"><label>Tujuan Belajar</label><textarea id="abTujuan"></textarea></div><div class="field"><label>Kegiatan Belajar</label><textarea id="abKegiatan"></textarea></div><div class="field"><label>Refleksi</label><textarea id="abRefleksi"></textarea></div><div class="actions"><button class="btn" onclick="saveAgenda()">Simpan Agenda</button></div></div><div class="card"><h3>Agenda Saya</h3><div id="agendaTable" class="loading">Memuat...</div></div>`;loadAgenda()}
function saveAgenda(){const d={tanggal:v('abTanggal'),mataPelajaran:v('abMapel'),materi:v('abMateri'),tujuanBelajar:v('abTujuan'),kegiatan:v('abKegiatan'),refleksi:v('abRefleksi')};if(!d.tanggal||!d.mataPelajaran||!d.materi) return alert('Tanggal, Mata Pelajaran, dan Materi wajib diisi.');google.script.run.withSuccessHandler(r=>{alert(r.message);agenda()}).withFailureHandler(showError).saveAgendaBelajar(d)}
function loadAgenda(){google.script.run.withSuccessHandler(rows=>{if(!rows.length){document.getElementById('agendaTable').innerHTML='<div class="muted">Belum ada data.</div>';return}document.getElementById('agendaTable').innerHTML='<div class="tableWrap"><table class="table"><tr><th>Tanggal</th><th>Mapel</th><th>Materi</th><th>Kegiatan</th><th>Aksi</th></tr>'+rows.map(r=>`<tr><td>${esc(r.tanggal)}</td><td>${esc(r.mataPelajaran)}</td><td>${esc(r.materi)}</td><td>${esc(r.kegiatan)}</td><td><button class="btn danger" onclick="delAgenda('${esc(r.id)}')">Hapus</button></td></tr>`).join('')+'</table></div>'}).withFailureHandler(showError).getAgendaBelajar()}
function delAgenda(id){if(!confirm('Hapus agenda ini?'))return;google.script.run.withSuccessHandler(()=>agenda()).withFailureHandler(showError).deleteAgendaBelajar(id)}
function owner(){const x=APP.setup||{};document.getElementById('content').innerHTML=`<div class="card"><div class="title">⚙️ Pengaturan OWNER</div><div class="notice">OWNER dapat mengatur MASTER_SIM, Gateway URL, token Gateway, serta membuat konfigurasi kelas. Token disimpan di Script Properties dan tidak dikirim ke browser.</div><div class="grid"><div class="field"><label>ID Spreadsheet MASTER_SIM</label><input id="masterId" value="${esc(x.masterSimId)}"></div><div class="field"><label>URL Gateway</label><input id="gatewayUrl" value="${esc(x.gatewayUrl)}"></div><div class="field"><label>Token Gateway</label><input id="gatewayToken" type="password" value="${esc(x.gatewayToken)}"></div><div class="field"><label>Email OWNER</label><input value="${esc(x.ownerEmail)}" disabled></div></div><div class="actions"><button class="btn" onclick="saveOwner()">RUN — Simpan & Inisialisasi MASTER_SIM</button></div></div><div class="card"><h3>➕ Tambah / Update Kelas</h3><div class="grid"><div class="field"><label>ID Kelas</label><input id="idKelas" placeholder="X-1"></div><div class="field"><label>Nama Kelas</label><input id="namaKelas" placeholder="X IPA 1"></div><div class="field"><label>ID Spreadsheet Kelas / MASTER_KELAS</label><input id="spreadsheetId"></div><div class="field"><label>ID Folder Drive Kelas</label><input id="folderId"></div><div class="field"><label>Email ADMIN_KELAS</label><input id="adminEmail"></div></div><button class="btn" onclick="saveKelas()">RUN — Simpan Kelas & Buat Sheet</button></div><div class="card"><h3>Kelas Terdaftar</h3><div class="tableWrap"><table class="table"><tr><th>ID</th><th>Kelas</th><th>Spreadsheet</th><th>Admin</th></tr>${(APP.kelas||[]).map(k=>`<tr><td>${esc(k.idKelas)}</td><td>${esc(k.namaKelas)}</td><td>${esc(k.spreadsheetId)}</td><td>${esc(k.adminEmail)}</td></tr>`).join('')}</table></div></div>`}
function saveOwner(){google.script.run.withSuccessHandler(r=>{alert(r.message);google.script.run.withSuccessHandler(init).getInitialData()}).withFailureHandler(showError).ownerSaveConfig({masterSimId:v('masterId'),gatewayUrl:v('gatewayUrl'),gatewayToken:v('gatewayToken')})}
function saveKelas(){google.script.run.withSuccessHandler(r=>{alert(r.message);google.script.run.withSuccessHandler(init).getInitialData()}).withFailureHandler(showError).ownerSaveKelas({idKelas:v('idKelas'),namaKelas:v('namaKelas'),spreadsheetId:v('spreadsheetId'),folderId:v('folderId'),adminEmail:v('adminEmail')})}
function admin(){document.getElementById('content').innerHTML=`<div class="card"><div class="title">👥 User Siswa</div><div class="grid"><div class="field"><label>ID User</label><input id="uid"></div><div class="field"><label>NISN</label><input id="nisn"></div><div class="field"><label>Nama</label><input id="unama"></div><div class="field"><label>Email Google</label><input id="uemail"></div></div><button class="btn" onclick="saveStudent()">RUN — Simpan User Siswa</button></div><div class="card"><h3>Daftar Siswa</h3><div id="students" class="loading">Memuat...</div></div>`;loadStudents()}
function saveStudent(){google.script.run.withSuccessHandler(r=>{alert(r.message);admin()}).withFailureHandler(showError).adminSaveStudent({idUser:v('uid'),nisn:v('nisn'),nama:v('unama'),email:v('uemail')})}
function loadStudents(){google.script.run.withSuccessHandler(rows=>{document.getElementById('students').innerHTML='<div class="tableWrap"><table class="table"><tr><th>ID</th><th>NISN</th><th>Nama</th><th>Email</th><th>Aksi</th></tr>'+rows.map(r=>`<tr><td>${esc(r.idUser)}</td><td>${esc(r.nisn)}</td><td>${esc(r.nama)}</td><td>${esc(r.email)}</td><td><button class="btn danger" onclick="delStudent('${esc(r.idUser)}')">Hapus</button></td></tr>`).join('')+'</table></div>'}).withFailureHandler(showError).adminListStudents()}
function delStudent(id){if(confirm('Hapus siswa?'))google.script.run.withSuccessHandler(()=>admin()).withFailureHandler(showError).deleteStudent(id)}
function v(id){return document.getElementById(id)?.value||''}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function showError(e){alert(e&&e.message?e.message:e)}
</script>
