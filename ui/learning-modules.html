<script>
/* SATRIA MUDA V1.2 — Learning Challenge UI. */
(function(){
function call(fn,...args){return new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](...args))}
function root(){return document.getElementById('content')}
function safe(v){return typeof esc==='function'?esc(v):String(v==null?'':v).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}
window.lmStudentPage=async function(){lmEnsureStyle();root().innerHTML='<div class="lm"><div class="loading">Memuat modul aktif...</div></div>';try{const d=await call('getLearningDashboardFixed');root().innerHTML=`<div class="lm"><section class="lmHero"><h1>🧠 Kegiatan Belajar Mandiri</h1><p>Tantangan Literasi & Numerasi — pilih modul aktif dan naikkan levelmu.</p></section><div class="lmStats"><div class="lmStat"><b>⭐ ${d.xp||0}</b><span>XP</span></div><div class="lmStat"><b>🔥 ${d.streak||0}</b><span>Streak hari</span></div><div class="lmStat"><b>✓ ${d.correct||0}</b><span>Jawaban benar</span></div><div class="lmStat"><b>${safe(d.badge||'🎯')}</b><span>Badge</span></div></div><div class="lmCard"><h3>🎯 Modul Aktif</h3><p class="lmSmall">Modul yang tampil hanya yang aktif dan sesuai kelas Anda. Modul <b>Semua Kelas</b> berlaku untuk seluruh kelas.</p><div class="lmWorlds">${(d.available||[]).map(lmModuleCard).join('')||'<div class="lmNotice">Belum ada modul aktif untuk kelas Anda.</div>'}</div></div></div>`}catch(e){root().innerHTML='<div class="card"><div class="notice">Gagal memuat modul: '+safe(e.message||e)+'</div></div>'}}
function lmModuleCard(x){const icon=x.jenis==='LITERASI'?'📖':'🔢',cls=x.jenis==='NUMERASI'?' num':'';return `<div class="lmWorld${cls}"><h3>${icon} ${safe(x.namaModul)}</h3><div class="lmSmall">${safe(x.jenis)} • Target ${safe(x.targetKelas)}</div>${(x.levels||[]).map(l=>`<div class="lmLevel ${l.unlocked?'':'lock'}"><div><b>Level ${l.level}</b><div class="lmSmall">${l.soal||0} soal aktif</div></div><button ${l.unlocked&&l.soal?'':'disabled'} onclick="startLM('${safe(x.idModul)}',${l.level})">${l.unlocked?(l.soal?'Mulai':'Kosong'):'🔒 Terkunci'}</button></div>`).join('')}</div>`}
window.startLM=async function(idModul,level){try{const d=await call('startLearningChallengeFixed',idModul,level,5);lmRenderChallenge(d)}catch(e){alert(e.message||e)}}
window.lmTeacherPage=async function(){lmEnsureStyle();const c=root();c.innerHTML='<div class="lm"><div class="loading">Memuat bank soal dan modul...</div></div>';try{const [qs,mods]=await Promise.all([call('teacherListQuestions',{}),call('teacherListLearningModules')]);c.innerHTML=`<div class="lm"><section class="lmHero"><h1>🧠 Bank Soal & Modul</h1><p>Kelola modul dan buat soal Literasi/Numerasi sesuai kelas sasaran.</p></section><div class="lmToolbar"><button class="lmBtn" onclick="lmTeacherModuleForm()">＋ Buat Modul</button><button class="lmBtn" onclick="lmTeacherForm()">＋ Buat Soal</button><button class="lmBtn" onclick="lmTeacherPage()">↻ Muat Ulang</button></div><div class="lmCard"><h3>📚 Modul Saya</h3><div class="lmTableWrap"><table class="lmTable"><thead><tr><th>Jenis</th><th>Modul</th><th>Target</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${mods.map(m=>`<tr><td>${m.jenis}</td><td><b>${safe(m.namaModul)}</b><br><span class="lmSmall">${safe(m.deskripsi||'')}</span></td><td>${safe(m.targetKelas)}</td><td><span class="lmPill">${safe(m.status)}</span></td><td><button class="lmBtn" onclick="lmToggleModule('${safe(m.idModul)}','${m.status==='ACTIVE'?'INACTIVE':'ACTIVE'}')">${m.status==='ACTIVE'?'Nonaktifkan':'Aktifkan'}</button></td></tr>`).join('')||'<tr><td colspan="5">Belum ada modul.</td></tr>'}</tbody></table></div></div><div class="lmCard"><h3>📝 Soal Saya</h3><div class="lmTableWrap"><table class="lmTable"><thead><tr><th>Modul</th><th>Tipe</th><th>Level</th><th>Target</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${qs.map(q=>`<tr><td><b>${safe((mods.find(m=>m.idModul===q.idModul)||{}).namaModul||q.idModul)}</b><br><span class="lmSmall">${safe(q.materi)}</span></td><td>${q.tipeSoal==='PG'?'Pilihan Ganda':'Benar/Salah'}</td><td>${q.level}</td><td>${safe(q.targetKelas)}</td><td><span class="lmPill">${safe(q.status)}</span></td><td><div class="lmActions"><button class="lmBtn" onclick="lmPublish('${safe(q.idSoal)}')">Publikasikan</button><button class="lmBtn lmDanger" onclick="lmDelete('${safe(q.idSoal)}')">Hapus</button></div></td></tr>`).join('')||'<tr><td colspan="6">Belum ada soal.</td></tr>'}</tbody></table></div></div></div>`}catch(e){c.innerHTML='<div class="card"><div class="notice">'+safe(e.message||e)+'</div></div>'}}
window.lmTeacherModuleForm=async function(){try{const classes=await call('getMasterKelasForLearning');const p=APP.session.soalPermission||{};const types=(p.literasi?'<option value="LITERASI">📖 Literasi</option>':'')+(p.numerasi?'<option value="NUMERASI">🔢 Numerasi</option>':'');root().innerHTML=`<div class="lm"><div class="lmCard"><h2>＋ Buat Modul</h2><div class="lmGrid"><div class="lmField"><label>Induk Modul</label><select id="lmm_jenis">${types}</select></div><div class="lmField"><label>Nama Modul</label><input id="lmm_nama" placeholder="Contoh: Literasi Informasi Digital"></div><div class="lmField lmFull"><label>Deskripsi</label><textarea id="lmm_deskripsi" placeholder="Tujuan dan gambaran modul"></textarea></div><div class="lmField"><label>Target Kelas</label><select id="lmm_target"><option value="ALL">Semua Kelas</option>${classes.map(k=>`<option value="${safe(k.idKelas)}">${safe(k.namaKelas)}</option>`).join('')}</select></div><div class="lmField"><label>Status</label><select id="lmm_status"><option value="ACTIVE">ACTIVE — tampil untuk siswa</option><option value="INACTIVE">INACTIVE — disimpan, tidak tampil</option></select></div></div><div class="lmActions"><button class="lmBtn" onclick="lmSaveModule()">Simpan Modul</button><button class="lmBtn" onclick="lmTeacherForm()">Batal</button></div></div></div>`}catch(e){alert(e.message||e)}}
window.lmSaveModule=async function(){const d={jenis:document.getElementById('lmm_jenis').value,namaModul:document.getElementById('lmm_nama').value,deskripsi:document.getElementById('lmm_deskripsi').value,targetKelas:document.getElementById('lmm_target').value,status:document.getElementById('lmm_status').value};if(!d.namaModul.trim())return alert('Nama modul wajib diisi.');try{await call('teacherSaveLearningModule',d);alert('Modul berhasil disimpan.');lmTeacherForm()}catch(e){alert(e.message||e)}}
window.lmToggleModule=async function(id,status){try{await call('teacherSetLearningModuleStatus',id,status);lmTeacherPage()}catch(e){alert(e.message||e)}}
window.lmTeacherForm=async function(){try{const [mods,classes]=await Promise.all([call('teacherListLearningModules'),call('getMasterKelasForLearning')]);const p=APP.session.soalPermission||{};const types=(p.literasi?'<option value="LITERASI">📖 Literasi</option>':'')+(p.numerasi?'<option value="NUMERASI">🔢 Numerasi</option>':'');root().innerHTML=`<div class="lm"><div class="lmCard"><div class="lmFormHead"><div><h2>＋ Pembuat Soal</h2><p class="lmSmall">Buat modul dari sini atau pilih modul yang sudah tersedia.</p></div><button class="lmBtn lmPrimary" onclick="lmTeacherModuleForm()">＋ Buat Modul Baru</button></div><div class="lmNotice">Pilih tipe soal. Form jawaban akan berubah otomatis sesuai tipe.</div><div class="lmGrid"><div class="lmField"><label>Induk Soal</label><select id="lmt_jenis" onchange="lmFilterModules()">${types}</select></div><div class="lmField"><label>Modul</label><div class="lmInline"><select id="lmt_modul"></select><button class="lmBtn" type="button" onclick="lmTeacherModuleForm()">＋</button></div></div><div class="lmField"><label>Level</label><select id="lmt_level"><option value="1">1 — Pemula</option><option value="2">2 — Penjelajah</option><option value="3">3 — Penantang</option><option value="4">4 — Master</option><option value="5">5 — Satria</option></select></div><div class="lmField"><label>Target Kelas</label><select id="lmt_target"><option value="ALL">Semua Kelas</option>${classes.map(k=>`<option value="${safe(k.idKelas)}">${safe(k.namaKelas)}</option>`).join('')}</select></div><div class="lmField"><label>Materi</label><input id="lmt_materi" placeholder="Contoh: Interpretasi grafik"></div><div class="lmField"><label>Indikator</label><input id="lmt_indikator" placeholder="Kemampuan yang dilatih"></div><div class="lmField"><label>Tipe Soal</label><select id="lmt_tipe" onchange="lmRenderAnswerForm()"><option value="PG">Pilihan Ganda</option><option value="BENAR_SALAH">Benar / Salah</option></select></div><div class="lmField lmFull"><label>Stimulus</label><textarea id="lmt_stimulus" placeholder="Teks, data, tabel, grafik, atau konteks soal"></textarea></div><div class="lmField lmFull"><label>Pertanyaan</label><textarea id="lmt_pertanyaan" placeholder="Tulis pertanyaan..."></textarea></div><div id="lmAnswerArea" class="lmField lmFull"></div><div class="lmField lmFull"><label>Pembahasan</label><textarea id="lmt_pembahasan" placeholder="Jelaskan alasan jawaban agar siswa dapat belajar dari hasilnya."></textarea></div></div><div class="lmActions"><button class="lmBtn lmPrimary" onclick="lmSaveQuestion()">Simpan Draft</button><button class="lmBtn" onclick="lmTeacherPage()">Batal</button></div></div></div>`;window.LM_TEACHER_MODULES=mods;lmFilterModules();lmRenderAnswerForm()}catch(e){alert(e.message||e)}}
window.lmFilterModules=function(){const type=document.getElementById('lmt_jenis')?.value,sel=document.getElementById('lmt_modul');if(!sel)return;sel.innerHTML=(window.LM_TEACHER_MODULES||[]).filter(m=>m.jenis===type).map(m=>`<option value="${safe(m.idModul)}">${safe(m.namaModul)} • ${safe(m.targetKelas)}</option>`).join('')||'<option value="">Belum ada modul — klik ＋</option>'}
window.lmRenderAnswerForm=function(){const area=document.getElementById('lmAnswerArea'),type=document.getElementById('lmt_tipe')?.value;if(!area)return;if(type==='PG'){area.innerHTML='<div class="lmOptionGrid"><div class="lmField"><label>Option A</label><input id="lmt_a" placeholder="Pilihan A"></div><div class="lmField"><label>Option B</label><input id="lmt_b" placeholder="Pilihan B"></div><div class="lmField"><label>Option C</label><input id="lmt_c" placeholder="Pilihan C"></div><div class="lmField"><label>Option D</label><input id="lmt_d" placeholder="Pilihan D"></div><div class="lmField"><label>Option E</label><input id="lmt_e" placeholder="Pilihan E"></div><div class="lmField"><label>Jawaban Benar</label><select id="lmt_jawaban"><option value="">Pilih jawaban</option><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option></select></div></div>'}else{area.innerHTML='<div class="lmTFBox"><div class="lmField"><label>Option 1</label><input value="Benar" disabled></div><div class="lmField"><label>Option 2</label><input value="Salah" disabled></div><div class="lmField"><label>Jawaban Benar</label><select id="lmt_jawaban"><option value="">Pilih jawaban</option><option value="BENAR">Benar</option><option value="SALAH">Salah</option></select></div></div><div class="lmSmall">Tipe Benar/Salah otomatis menyediakan tepat dua pilihan: Benar dan Salah.</div>'}}
window.lmSaveQuestion=async function(){const type=document.getElementById('lmt_tipe').value,d={jenis:document.getElementById('lmt_jenis').value,idModul:document.getElementById('lmt_modul').value,level:Number(document.getElementById('lmt_level').value),targetKelas:document.getElementById('lmt_target').value,materi:document.getElementById('lmt_materi').value,indikator:document.getElementById('lmt_indikator').value,tipeSoal:type,stimulus:document.getElementById('lmt_stimulus').value,pertanyaan:document.getElementById('lmt_pertanyaan').value,opsiA:document.getElementById('lmt_a')?.value||'',opsiB:document.getElementById('lmt_b')?.value||'',opsiC:document.getElementById('lmt_c')?.value||'',opsiD:document.getElementById('lmt_d')?.value||'',opsiE:document.getElementById('lmt_e')?.value||'',jawaban:document.getElementById('lmt_jawaban').value,pembahasan:document.getElementById('lmt_pembahasan').value};if(!d.idModul)return alert('Pilih atau buat Modul terlebih dahulu.');try{await call('teacherSaveQuestion',d);alert('Soal disimpan sebagai Draft.');lmTeacherForm()}catch(e){alert(e.message||e)}}
})();
</script>
