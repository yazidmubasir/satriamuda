<script>
/* SATRIA MUDA — UI performance standard. Fast path + lightweight progress overlay. */
(function(){
  if(!document.getElementById('satriaFastStyle')){
    const s=document.createElement('style');s.id='satriaFastStyle';s.textContent='#satriaProgressOverlay{display:none;position:fixed;inset:0;z-index:99999}.satriaProgressShade{position:absolute;inset:0;background:rgba(3,7,12,.82)}.satriaProgressBox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(330px,calc(100vw - 36px));padding:24px 20px;border-radius:18px;background:#0b111a;color:#fff;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.4)}.satriaProgressSpin{width:34px;height:34px;margin:0 auto 12px;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:satriaSpin .65s linear infinite}.satriaProgressTitle{font-size:16px;font-weight:800}.satriaProgressText{margin-top:5px;font-size:11px;color:#aeb8c6}@keyframes satriaSpin{to{transform:rotate(360deg)}}body.satria-busy{overflow:hidden}';document.head.appendChild(s)}
  function progress(title,text){let o=document.getElementById('satriaProgressOverlay');if(!o){o=document.createElement('div');o.id='satriaProgressOverlay';o.innerHTML='<div class="satriaProgressShade"></div><div class="satriaProgressBox"><div class="satriaProgressSpin"></div><div class="satriaProgressTitle"></div><div class="satriaProgressText"></div></div>';document.body.appendChild(o)}o.querySelector('.satriaProgressTitle').textContent=title||'Sedang menyimpan...';o.querySelector('.satriaProgressText').textContent=text||'Data sedang diproses. Mohon tunggu sebentar.';o.style.display='block';document.body.classList.add('satria-busy')}
  function done(){const o=document.getElementById('satriaProgressOverlay');if(o)o.style.display='none';document.body.classList.remove('satria-busy')}
  window.satriaShowProgress=progress;window.satriaHideProgress=done;
  function run(fn,args,onOk,onErr){google.script.run.withSuccessHandler(function(r){done();onOk&&onOk(r)}).withFailureHandler(function(e){done();onErr?onErr(e):showError(e)})[fn].apply(null,args||[])}
  function resetModuleFields(){document.querySelectorAll('#moduleForm [id^="mf_"]').forEach(el=>{if(el.tagName==='SELECT')el.selectedIndex=0;else el.value=''});const d=document.querySelector('#moduleForm #mf_tanggal');if(d)d.value=new Date().toISOString().slice(0,10)}
  function setSaveButton(on){const b=document.getElementById('saveModuleBtn');if(!b)return;b.disabled=!!on;b.textContent=on?'Menyimpan...':'Simpan'}
  window.modulePage=function(kode){const cfg=(APP.menus||[]).find(m=>m.kode===kode);if(!cfg)return;document.getElementById('content').innerHTML='<div class="card"><div class="title">'+cfg.icon+' '+esc(cfg.nama)+'</div><div class="muted">Isi kegiatan Anda lalu simpan.</div><br><div id="moduleForm"><div class="loading">Menyiapkan formulir...</div></div><div class="actions"><button class="btn" id="saveModuleBtn" onclick="saveModule(\''+kode+'\')">Simpan '+esc(cfg.nama)+'</button></div></div><div class="card"><h3>Data Saya</h3><div id="moduleTable" class="loading">Memuat data...</div></div>';loadModuleForm(kode);loadModuleData(kode)};
  window.loadModuleData=function(kode){run('getSiswaModuleDataFast',[kode],function(rows){const box=document.getElementById('moduleTable');if(!box)return;if(!rows||!rows.length){box.innerHTML='<div class="muted">Belum ada data.</div>';return}const keys=Object.keys(rows[0]).filter(k=>!['id','timestamp','email','nisn','nama','idKelas','_rowNumber'].includes(k));box.innerHTML='<div class="tableWrap"><table class="table"><tr>'+keys.map(k=>'<th>'+esc(k)+'</th>').join('')+'<th>Aksi</th></tr>'+rows.map(r=>'<tr>'+keys.map(k=>'<td>'+esc(r[k])+'</td>').join('')+'<td><button class="btn danger" onclick="delModule(\''+kode+'\',\''+esc(r.id)+'\')">Hapus</button></td></tr>').join('')+'</table></div>'})};
  window.saveModule=function(kode){const fields=[...document.querySelectorAll('[id^="mf_"]')];const data={};fields.forEach(el=>data[el.id.substring(3)]=el.value);if(fields.some(el=>!String(el.value||'').trim()))return alert('Mohon lengkapi semua kolom.');setSaveButton(true);progress('Sedang menyimpan...','Data sedang disimpan ke sistem.');run('saveSiswaModuleFast',[kode,data],function(r){resetModuleFields();setSaveButton(false);loadModuleData(kode);showToastFast(r&&r.message||'Data berhasil disimpan.','success')},function(e){setSaveButton(false);showError(e)})};
  window.delModule=function(kode,id){if(!confirm('Hapus data ini?'))return;progress('Sedang menghapus...','Data sedang dihapus dari sistem.');run('deleteSiswaModuleFast',[kode,id],function(){loadModuleData(kode);showToastFast('Data berhasil dihapus.','success')})};
  window.showToastFast=function(msg,type){let t=document.getElementById('satriaFastToast');if(!t){t=document.createElement('div');t.id='satriaFastToast';t.style.cssText='position:fixed;right:18px;bottom:18px;z-index:100000;padding:10px 14px;border-radius:12px;background:#102018;color:#fff;font-size:12px;box-shadow:0 8px 25px rgba(0,0,0,.25);transition:opacity .2s';document.body.appendChild(t)}t.textContent=msg;t.style.opacity='1';clearTimeout(window.__satriaToastTimer);window.__satriaToastTimer=setTimeout(()=>t.style.opacity='0',1800)};
  window.__delete7KAIH=function(id){if(!id||!confirm('Hapus jejak 7KAIH ini?'))return;progress('Sedang menghapus...','Jejak sedang dihapus.');run('deleteSiswaModuleFast',['TUJUHKAIH',id],function(){if(typeof loadModuleData==='function')loadModuleData('TUJUHKAIH');showToastFast('Jejak berhasil dihapus.','success')})};
})();
</script>
