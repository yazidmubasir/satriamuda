<style>
:root{--green-950:#06271d;--green-900:#0b3d2e;--green-800:#105b40;--green-700:#168052;--green-600:#21a366;--green-100:#e5f5ed;--green-50:#f3faf6;--gold:#d4af37;--ink:#17352b;--muted:#71877d;--surface:#fff;--line:#e2ece7;--danger:#b42318;--shadow:0 10px 30px rgba(9,54,38,.08);--shadow-lg:0 18px 50px rgba(9,54,38,.12);--radius:18px}
