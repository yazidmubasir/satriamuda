<style>
:root{--red-900:#8f1912;--red-700:#b92216;--red-500:#d63a2d;--cream:#e7e6c2;--cream-soft:#f4f3dc;--cocoa:#4d2d1b;--cocoa-soft:#6b4630;--pistachio:#b7c688;--pistachio-soft:#dfe6bd;--ink:#3d3029;--muted:#766a62;--surface:#fffdf8;--line:#e8e1d8;--danger:#a51d17;--shadow:0 10px 30px rgba(77,45,27,.10);--shadow-lg:0 18px 50px rgba(77,45,27,.14);--radius:18px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:linear-gradient(180deg,var(--cream-soft) 0,#fbfaf2 42%,#f8f5ee 100%);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}.app{min-height:100vh}
header{height:76px;background:linear-gradient(135deg,var(--red-900),var(--red-700) 58%,var(--red-500));color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:50;box-shadow:0 6px 24px rgba(77,45,27,.18)}header:after{content:"";position:absolute;inset:auto 0 0;height:3px;background:linear-gradient(90deg,var(--cream),var(--pistachio),var(--cream));opacity:.9}.brand{font-size:21px;font-weight:850;letter-spacing:.7px}.sub{font-size:11px;opacity:.82;margin-top:4px;letter-spacing:.3px}.layout{display:flex;min-height:calc(100vh - 76px)}
aside{width:250px;background:rgba(255,253,248,.96);backdrop-filter:blur(16px);border-right:1px solid var(--line);padding:18px 13px;position:sticky;top:76px;height:calc(100vh - 76px);overflow-y:auto}.nav{display:flex;align-items:center;justify-content:space-between;gap:9px;width:100%;border:0;background:transparent;text-align:left;padding:11px 13px;border-radius:12px;margin-bottom:5px;font:inherit;font-weight:650;color:var(--cocoa-soft);cursor:pointer;transition:all .18s ease}.nav:hover{background:var(--pistachio-soft);color:var(--cocoa);transform:translateX(2px)}.nav.active{background:linear-gradient(135deg,var(--pistachio-soft),var(--pistachio));color:var(--cocoa);box-shadow:inset 3px 0 var(--red-700)}.parent-nav{font-weight:850}.chevron{font-size:12px;transition:transform .2s}.chevron.rotate{transform:rotate(180deg)}.submenu{display:none;padding:2px 0 7px 16px;border-left:2px solid var(--pistachio);margin:0 0 7px 15px}.submenu.open{display:block}.subnav{font-size:13px;padding:9px 11px;margin-bottom:4px}.menu-separator{height:1px;background:var(--line);margin:14px 4px 10px}.special{font-weight:800}

cocoa);font-weight:800}.table tr:last-child td{border-bottom:0}.table tr:hover td{background:#fffdf4}.loading{text-align:center;padding:55px 20px;color:var(--muted)}.badge{background:var(--cream);color:var(--cocoa);padding:7px 11px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}.notice{padding:14px 15px;border-radius:13px;background:var(--cream);border:1px solid #d9d8aa;margin-bottom:16px;font-size:13px}.success{background:#edf2d9;color:var(--cocoa)}.hidden{display:none}.hero{background:linear-gradient(135deg,var(--red-900),var(--red-700) 58%,var(--red-500));color:#fff;border:0;overflow:hidden;position:relative}.hero:after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;right:-80px;top:-110px;background:rgba(231,230,194,.14)}.hero .muted{color:rgba(255,255,255,.82)}.menu-card{min-height:150px}

</style>
