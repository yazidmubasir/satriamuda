<script>
(function(){
  const oldInit=window.init;
  window.init=function(d){oldInit(d);if((d&&d.session&&d.session.role)==='OWNER'){const nav=document.getElementById('ownerNav');if(nav&&!document.getElementById('masterDataNav'))nav.insertAdjacentHTML('beforeend','<button id="masterDataNav" class="nav special" onclick="showPage(\'masterdata\')">🗂️ Master Data</button>')}};
  const oldShow=window.showPage;
  window.showPage=function(p){if(p==='masterdata'){document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));masterdata();return}oldShow(p)};
  window.masterdata=function(){document.getElementById('content').innerHTML=`<div class="card hero"><div class="title">🗂️ Master Data</div><div class="muted">Kelola Guru, Mata Pelajaran, dan penugasan guru ke kelas. Semua perubahan dilakukan melalui frontend OWNER.</div></div><div class="card"><div class="actions"><button class="btn" onclick="masterTab('guru')">👨‍🏫 Guru</button><button class="btn secondary" onclick="masterTab('mapel')">📚 Mata Pelajaran</button><button class="btn secondary" onclick="masterTab('tugas')">🏫 Guru → Kelas → Mapel</button></div><div id="masterArea" class="loading">Memuat...</div></div>`;loadMasterData()};
  let MD={guru:[],mapel:[],guruKelas:[],kelas:[]};
  window.loadMasterData=function(){google.script.run.withSuccessHandler(d=>{MD=d||MD;masterTab('guru')}).withFailureHandler(showError).getMasterData()};
  window.masterTab=function(tab){const a=document.getElementById('masterArea');if(!a)return;if(tab==='guru')a.innerHTML=`<h3>👨‍🏫 Master Guru</h3><div class="grid"><div class="field"><label>NIP</label><input id="mg_nip" placeholder="Nomor Induk Pegawai"></div><div class="field"><label>Nama Guru</label><input id="mg_nama" placeholder="Nama lengkap"></div><div class="field"><label>Email Google</label><input id="mg_email" type="email" placeholder="guru@sekolah.id"></div></div><button class="btn" onclick="saveGuru()">RUN — Simpan Guru</button><br><br>${guruTable()}`;else if(tab==='mapel')a.innerHTML=`<h3>📚 Master Mata Pelajaran</h3><div class="grid"><div class="field"><label>Kode Mata Pelajaran</label><input id="mm_kode" placeholder="FIS"></div><div class="field"><label>Nama Mata Pelajaran</label><input id="mm_nama" placeholder="Fisika"></div><div class="field"><label>Kelompok</label><input id="mm_kelompok" placeholder="MIPA / Umum / ..."></div></div><button class="btn" onclick="saveMapel()">RUN — Simpan Mata Pelajaran</button><br><br>${mapelTable()}`;else a.innerHTML=`<h3>🏫 Penugasan Guru</h3><div class="grid"><div class="field"><label>Guru</label><select id="gt_guru"><option value="">Pilih guru...</option>${MD.guru.map(x=>`<option value="${esc(x.idGuru)}">${esc(x.namaGuru)} — ${esc(x.nip)}</option>`).join('')}</select></div><div class="field"><label>Kelas</label><select id="gt_kelas"><option value="">Pilih kelas...</option>${MD.kelas.map(x=>`<option value="${esc(x.idKelas)}">${esc(x.idKelas)} — ${esc(x.namaKelas)}</option>`).join('')}</select></div><div class="field"><label>Mata Pelajaran</label><select id="gt_mapel"><option value="">Pilih mapel...</option>${MD.mapel.map(x=>`<option value="${esc(x.kodeMapel)}">${esc(x.kodeMapel)} — ${esc(x.namaMapel)}</option>`).join('')}</select></div></div><button class="btn" onclick="saveTugas()">RUN — Simpan Penugasan</button><br><br>${tugasTable()}`};
  function guruTable(){return `<div class="tableWrap"><table class="table"><tr><th>NIP</th><th>Nama</th><th>Email</th><th>Aksi</th></tr>${MD.guru.map(x=>`<tr><td>${esc(x.nip)}</td><td>${esc(x.namaGuru)}</td><td>${esc(x.email||'-')}</td><td><button class="btn danger" onclick="delGuru('${esc(x.idGuru)}')">Hapus</button></td></tr>`).join('')}</table></div>`}
  function mapelTable(){return `<div class="tableWrap"><table class="table"><tr><th>Kode</th><th>Mapel</th><th>Kelompok</th><th>Aksi</th></tr>${MD.mapel.map(x=>`<tr><td>${esc(x.kodeMapel)}</td><td>${esc(x.namaMapel)}</td><td>${esc(x.kelompok||'-')}</td><td><button class="btn danger" onclick="delMapel('${esc(x.kodeMapel)}')">Hapus</button></td></tr>`).join('')}</table></div>`}
  function tugasTable(){const guru=Object.fromEntries(MD.guru.map(x=>[x.idGuru,x.namaGuru])),mapel=Object.fromEntries(MD.mapel.map(x=>[x.kodeMapel,x.namaMapel]));return `<div class="tableWrap"><table class="table"><tr><th>Guru</th><th>Kelas</th><th>Mapel</th><th>Aksi</th></tr>${MD.guruKelas.map(x=>`<tr><td>${esc(guru[x.idGuru]||x.idGuru)}</td><td>${esc(x.idKelas)}</td><td>${esc(mapel[x.kodeMapel]||x.kodeMapel)}</td><td><button class="btn danger" onclick="delTugas('${esc(x.idGuru)}','${esc(x.idKelas)}','${esc(x.kodeMapel)}')">Hapus</button></td></tr>`).join('')}</table></div>`}
  window.saveGuru=function(){google.script.run.withSuccessHandler(r=>{alert(r.message);loadMasterData()}).withFailureHandler(showError).saveMasterGuru({nip:v('mg_nip'),namaGuru:v('mg_nama'),email:v('mg_email')})};
  window.delGuru=function(id){if(confirm('Hapus guru beserta penugasannya?'))google.script.run.withSuccessHandler(()=>loadMasterData()).withFailureHandler(showError).deleteMasterGuru(id)};
  window.saveMapel=function(){google.script.run.withSuccessHandler(r=>{alert(r.message);loadMasterData()}).withFailureHandler(showError).saveMasterMapel({kodeMapel:v('mm_kode'),namaMapel:v('mm_nama'),kelompok:v('mm_kelompok')})};
  window.delMapel=function(k){if(confirm('Hapus mata pelajaran?'))google.script.run.withSuccessHandler(()=>loadMasterData()).withFailureHandler(showError).deleteMasterMapel(k)};
  window.saveTugas=function(){google.script.run.withSuccessHandler(r=>{alert(r.message);loadMasterData()}).withFailureHandler(showError).saveGuruKelas({idGuru:v('gt_guru'),idKelas:v('gt_kelas'),kodeMapel:v('gt_mapel')})};
  window.delTugas=function(g,k,m){if(confirm('Hapus penugasan ini?'))google.script.run.withSuccessHandler(()=>loadMasterData()).withFailureHandler(showError).deleteGuruKelas(g,k,m)};
})();
</script>
