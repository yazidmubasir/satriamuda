<script>
/* SATRIA MUDA — Standard async operation overlay. */
(function(){
  if(window.__SATRIA_PROGRESS_INSTALLED__)return;
  window.__SATRIA_PROGRESS_INSTALLED__=true;
  let active=0;
  function ensure(){if(document.getElementById('satriaProgressOverlay'))return;const el=document.createElement('div');el.id='satriaProgressOverlay';el.innerHTML='<div class="sp-backdrop"></div><div class="sp-dialog" role="status" aria-live="polite"><div class="sp-spinner"></div><div class="sp-title">Sedang memproses...</div><div class="sp-text">Data sedang disimpan ke sistem.<br>Mohon tunggu sebentar.</div></div>';document.body.appendChild(el);const s=document.createElement('style');s.textContent='#satriaProgressOverlay{display:none;position:fixed;inset:0;z-index:99999}.sp-backdrop{position:absolute;inset:0;background:rgba(4,8,15,.88);backdrop-filter:blur(5px)}.sp-dialog{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(360px,calc(100vw - 40px));box-sizing:border-box;padding:28px 24px;border:1px solid rgba(255,255,255,.12);border-radius:22px;background:linear-gradient(145deg,#101827,#070b12);box-shadow:0 24px 70px rgba(0,0,0,.55);text-align:center;color:#fff;font-family:inherit}.sp-spinner{width:42px;height:42px;margin:0 auto 17px;border:4px solid rgba(255,255,255,.18);border-top-color:#fff;border-right-color:#bde0fe;border-radius:50%;animation:spSpin .8s linear infinite}.sp-title{font-size:17px;font-weight:800}.sp-text{margin-top:7px;color:rgba(255,255,255,.68);font-size:12px;line-height:1.55}@keyframes spSpin{to{transform:rotate(360deg)}}body.satria-busy{overflow:hidden}';document.head.appendChild(s)}
  function show(name){ensure();active++;const o=document.getElementById('satriaProgressOverlay');if(o){o.querySelector('.sp-title').textContent=name==='delete'?'Sedang menghapus...':name==='publish'?'Sedang mempublikasikan...':'Sedang menyimpan...';o.querySelector('.sp-text').innerHTML=name==='delete'?'Data sedang dihapus dari sistem.<br>Mohon tunggu sebentar.':name==='publish'?'Data sedang dipublikasikan.<br>Mohon tunggu sebentar.':'Data sedang disimpan ke sistem.<br>Mohon tunggu sebentar.';o.style.display='block'}document.body.classList.add('satria-busy')}
  function hide(){active=Math.max(0,active-1);if(active)return;const o=document.getElementById('satriaProgressOverlay');if(o)o.style.display='none';document.body.classList.remove('satria-busy')}
  window.satriaShowProgress=show;window.satriaHideProgress=hide;
  const mutating=/^(save|simpan|delete|hapus|update|create|append|publish|ownerSave|adminSave|teacherSave|teacherPublish|set.*Status)/i;
  function wrap(runner){return new Proxy(runner,{get(target,prop){if(typeof prop!=='string')return target[prop];if(prop==='withSuccessHandler')return function(cb){return wrap(target.withSuccessHandler(function(res,user){hide();return cb?cb(res,user):res}))};if(prop==='withFailureHandler')return function(cb){return wrap(target.withFailureHandler(function(err,user){hide();return cb?cb(err,user):err}))};if(prop==='withUserObject')return function(obj){return wrap(target.withUserObject(obj))};const original=target[prop];if(typeof original!=='function')return original;return function(){if(mutating.test(prop))show(prop.toLowerCase().includes('delete')||prop.toLowerCase().includes('hapus')?'delete':prop.toLowerCase().includes('publish')?'publish':'save');return original.apply(target,arguments)}}})}
  try{if(window.google&&google.script&&google.script.run)google.script.run=wrap(google.script.run)}catch(e){console.warn('SATRIA progress overlay:',e)}
})();
</script>
