<script>
/* SATRIA MUDA — Kegiatan Belajar Mandiri V1.5
   Satu file UI untuk siswa + petugas soal + runtime challenge.
   7KAIH sengaja tidak disentuh.
*/
(function(){
const STYLE=`<style id="lm-v15-style">
.lm{--p:#cdb4db;--pink:#ffc8dd;--baby:#ffafcc;--blue:#bde0fe;--sky:#a2d2ff;--ink:#493b55;--muted:#7c7083}.lm *{box-sizing:border-box}.lmHero{padding:24px;border-radius:24px;background:linear-gradient(135deg,#eadcf0,#ffc8dd 55%,#bde0fe);color:var(--ink);margin-bottom:18px}.lmHero h1{margin:0 0 7px;font-size:28px}.lmHero p{margin:0;color:#6d6175}.lmStats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}.lmStat,.lmCard{background:#fff;border:1px solid #eadfee;border-radius:20px;padding:18px;box-shadow:0 8px 24px rgba(73,59,85,.07)}.lmStat b{display:block;font-size:24px;color:var(--ink)}.lmStat span,.lmSmall{font-size:12px;color:var(--muted)}.lmGridCards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.lmModuleCard{border:1px solid #eadfee;border-radius:22px;padding:20px;background:linear-gradient(135deg,#fff,#f8f0fa);cursor:pointer;transition:.15s}.lmModuleCard:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(73,59,85,.1)}.lmModuleCard h3{margin:0 0 6px;color:var(--ink);font-size:20px}.lmModuleIcon{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ffc8dd,#bde0fe);font-size:27px;margin-bottom:12px}.lmTypeGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:15px}.lmTypeCard{border:1px solid #eadfee;border-radius:18px;padding:16px;background:#fff}.lmTypeCard h3{margin:0 0 5px;color:var(--ink)}.lmLevel{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;margin-top:9px;border-radius:14px;background:#fff;border:1px solid #eadfee}.lmLevel.lock{opacity:.55}.lmLevel button,.lmBtn{border:0;border-radius:12px;padding:9px 14px;font-weight:800;color:var(--ink);background:linear-gradient(135deg,#ffc8dd,#bde0fe);cursor:pointer}.lmLevel button:disabled{cursor:not-allowed;opacity:.5}.lmToolbar,.lmActions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.lmBtn:disabled{opacity:.55;cursor:not-allowed}.lmPrimary{background:linear-gradient(135deg,#cdb4db,#a2d2ff)!important}.lmDanger{background:#ffe3ea!important}.lmNotice{padding:12px;border-radius:13px;background:#f8f2fa;color:#6e6275;margin-bottom:14px}.lmField{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.lmField label{font-weight:800;color:var(--ink);font-size:13px}.lmField input,.lmField select,.lmField textarea{width:100%;padding:11px 12px;border:1px solid #e2d7e7;border-radius:12px;font:inherit;background:#fff}.lmField textarea{min-height:100px;resize:vertical}.lmFormHead{display:flex;justify-content:space-between;gap:12px;align-items:center}.lmFormHead h2{margin:0}.lmFormHead p{margin:5px 0 0}.lmGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.lmFull{grid-column:1/-1}.lmInline{display:flex;gap:7px}.lmInline select{flex:1}.lmOptionGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.lmTable{width:100%;border-collapse:collapse;font-size:12px}.lmTable th,.lmTable td{padding:9px;border-bottom:1px solid #eee6f0;text-align:left;vertical-align:top}.lmPill{display:inline-block;padding:4px 8px;border-radius:99px;background:#f3eaf6;font-size:11px;font-weight:800}.lmChallenge{max-width:980px;margin:auto}.lmQuestion{background:#fff;border:1px solid #eadff0;border-radius:18px;padding:20px;margin:14px 0}.lmQuestion h3{margin:0 0 12px;color:var(--ink);line-height:1.5}.lmOptions{display:grid;gap:10px}.lmOption{display:flex;gap:10px;align-items:flex-start;border:1px solid #e4d9e8;border-radius:12px;padding:12px;cursor:pointer;background:#fff;color:var(--ink)}.lmOption:hover{background:#faf5fc}.lmOption input{margin-top:4px}.lmStimulus{padding:15px;border-radius:15px;background:#faf5fb;color:#665a6d;line-height:1.6;margin:10px 0}.lmSubmit{position:sticky;bottom:12px;width:100%;padding:14px 18px;border:0;border-radius:14px;background:#6f4268;color:#fff;font-weight:700;cursor:pointer}.lmResult{text-align:center;padding:28px}.lmResult .score{font-size:52px;font-weight:900;color:var(--ink)}.lmBar{height:9px;background:#eee7f1;border-radius:99px;overflow:hidden;margin:12px 0}.lmBar i{display:block;height:100%;background:linear-gradient(90deg,#ffc8dd,#a2d2ff);border-radius:99px}.lmTimer{font-weight:800}.lmBack{margin-bottom:12px}.lmTFBox{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.lmStats{grid-template-columns:repeat(2,1fr)}.lmGridCards,.lmTypeGrid,.lmGrid,.lmOptionGrid,.lmTFBox{grid-template-columns:1fr}.lmHero h1{font-size:23px}.lmStat,.lmCard{padding:15px}.lmFormHead{align-items:flex-start;flex-direction:column}}
</style>`;
function root(){return document.getElementById('content')}
function escLM(v){return typeof esc==='function'?esc(v):String(v==null?'':v).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\"':'&quot;',"'":'&#39;'}[m]))}
function style(){if(!document.getElementById('lm-v15-style'))document.head.insertAdjacentHTML('beforeend',STYLE)}
function call(fn,...args){return new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](...args))}
window.learningModulePage=function(){style();const s=APP.session||{};if(s.role==='PETUGAS_SOAL'){lmTeacherPage();return}if(s.role==='SISWA'){lmStudentPage();return}root().innerHTML='<div class="card"><div class="title">🧠 Kegiatan Belajar Mandiri</div><div class="muted">Modul latihan diperuntukkan bagi siswa dan petugas bank soal.</div></div>'}
/* Generic legacy module router tetap dipertahankan agar modul lain tidak rusak. */
window.modulePage=function(kode){if(kode==='BELAJAR_MANDIRI'){learningModulePage();return}const cfg=(APP.menus||[]).find(m=>m.kode===kode);if(!cfg)return;root().innerHTML=`<div class="card"><div class="title">${cfg.icon} ${escLM(cfg.nama)}</div><div class="muted">Isi kegiatan Anda lalu simpan. Data hanya dapat dihapus oleh pemiliknya.</div><br><div id="moduleForm"><div class="loading">Memuat formulir...</div></div><div class="actions"><button class="btn" id="saveModuleBtn" onclick="saveModule('${kode}')">Simpan ${escLM(cfg.nama)}</button></div></div><div class="card"><h3>Data Saya</h3><div id="moduleTable" class="loading">Memuat...</div></div>`;if(typeof loadModuleForm==='function')loadModuleForm(kode);if(typeof loadModuleData==='function')loadModuleData(kode)}

/* ==================== SISWA: MODUL → JENIS → LEVEL ==================== */
async function lmStudentPage(){style();const c=root();c.innerHTML='<div class="lm"><div class="loading">Memuat modul belajar...</div></div>';try{const d=await call('getLearningDashboardFixed');window.LM_DASH=d;renderModuleCards(d)}catch(e){c.innerHTML='<div class="card"><div class="notice">Gagal memuat modul: '+escLM(e.message||e)+'</div></div>'}}
function groupModules(items){const map={};(items||[]).forEach(m=>{const key=(m.namaModul||m.idModul)+'||'+(m.targetKelas||'ALL');if(!map[key])map[key]={key,namaModul:m.namaModul,idTarget:m.targetKelas,items:[]};map[key].items.push(m)});return Object.values(map)}
function renderModuleCards(d){const groups=groupModules(d.available||[]);root().innerHTML=`<div class="lm"><section class="lmHero"><h1>🧠 Kegiatan Belajar Mandiri</h1><p>Belajar melalui modul yang aktif. Pilih modul terlebih dahulu, kemudian tentukan Literasi atau Numerasi.</p></section><div class="lmStats"><div class="lmStat"><b>⭐ ${d.xp||0}</b><span>XP</span></div><div class="lmStat"><b>🔥 ${d.streak||0}</b><span>Streak hari</span></div><div class="lmStat"><b>✓ ${d.correct||0}</b><span>Jawaban benar</span></div><div class="lmStat"><b>${escLM(d.badge||'🎯')}</b><span>Badge</span></div></div><div class="lmCard"><h3>📚 Pilih Modul</h3><p class="lmSmall">Modul yang tampil hanya modul ACTIVE untuk kelas Anda. <b>Semua Kelas</b> berlaku untuk seluruh siswa.</p><div class="lmGridCards">${groups.map((g,i)=>`<article class="lmModuleCard" onclick="lmChooseModule(${i})"><div class="lmModuleIcon">📚</div><h3>${escLM(g.namaModul)}</h3><div class="lmSmall">Target: ${escLM(g.idTarget||'Semua Kelas')}</div><div class="lmSmall">${g.items.length} jenis latihan tersedia</div></article>`).join('')||'<div class="lmNotice">Belum ada modul aktif untuk kelas Anda.</div>'}</div></div></div>`;window.LM_MODULE_GROUPS=groups}
window.lmChooseModule=function(i){const g=(window.LM_MODULE_GROUPS||[])[i];if(!g)return;root().innerHTML=`<div class="lm"><button class="lmBtn lmBack" onclick="lmStudentPage()">← Kembali ke Modul</button><section class="lmHero"><h1>📚 ${escLM(g.namaModul)}</h1><p>Pilih jenis latihan yang ingin dikerjakan.</p></section><div class="lmCard"><h3>🎯 Pilih Literasi atau Numerasi</h3><div class="lmTypeGrid">${g.items.map((m,idx)=>{const icon=m.jenis==='LITERASI'?'📖':'🔢';return `<article class="lmTypeCard"><h3>${icon} ${escLM(m.jenis)}</h3><div class="lmSmall">${escLM(m.deskripsi||'Latihan '+m.jenis.toLowerCase())}</div><div class="lmSmall">${escLM(m.targetKelas||'Semua Kelas')}</div><button class="lmBtn" style="margin-top:10px" onclick="lmChooseType(${i},${idx})">Pilih ${escLM(m.jenis)} →</button></article>`}).join('')}</div></div></div>`}
window.lmChooseType=function(gi,ii){const g=(window.LM_MODULE_GROUPS||[])[gi],m=g&&g.items[ii];if(!m)return;root().innerHTML=`<div class="lm"><button class="lmBtn lmBack" onclick="lmChooseModule(${gi})">← Kembali ke Jenis</button><section class="lmHero"><h1>${m.jenis==='LITERASI'?'📖':'🔢'} ${escLM(m.namaModul)}</h1><p>${escLM(m.jenis)} • pilih level yang sudah terbuka.</p></section><div class="lmCard"><h3>🏆 Pilih Level</h3>${(m.levels||[]).map(l=>`<div class="lmLevel ${l.unlocked?'':'lock'}"><div><b>Level ${l.level}</b><div class="lmSmall">${l.soal||0} soal aktif</div></div><button ${l.unlocked&&l.soal?'':'disabled'} onclick="startLMFixed('${escLM(m.idModul)}',${l.level})">${l.unlocked?(l.soal?'Mulai':'Kosong'):'🔒 Terkunci'}</button></div>`).join('')}</div></div>`}
window.startLMFixed=async function(idModul,level){try{const d=await call('startLearningChallengeFixed',idModul,level,5);lmRenderChallenge(d)}catch(e){alert(e.message||e)}}

function lmRenderChallenge(d){style();const c=root(),qs=d.questions||[];if(!qs.length){c.innerHTML='<div class="card"><div class="notice">Belum ada soal aktif untuk tantangan ini.</div></div>';return}const start=Date.now();c.innerHTML=`<div class="lm lmChallenge"><button class="lmBtn lmBack" onclick="lmStudentPage()">← Kembali</button><section class="lmHero"><h1>🎯 ${escLM(d.namaModul||'Tantangan Belajar')}</h1><p>${escLM(d.jenis||'')} • Level ${Number(d.level||1)} • Jawab semua soal dengan teliti.</p><div class="lmTimer" id="lmTimer">⏱ 00:00</div></section><div id="lmQuestions">${qs.map((q,i)=>{const opts=q.tipeSoal==='BENAR_SALAH'?[['BENAR',q.opsiA||'Benar'],['SALAH',q.opsiB||'Salah']]:[['A',q.opsiA],['B',q.opsiB],['C',q.opsiC],['D',q.opsiD],['E',q.opsiE]];return `<article class="lmQuestion"><span class="lmPill">Soal ${i+1}/${qs.length}</span><h3>${i+1}. ${escLM(q.pertanyaan)}</h3>${q.stimulus?`<div class="lmStimulus">${escLM(q.stimulus)}</div>`:''}<div class="lmOptions">${opts.filter(o=>o[1]!==undefined&&o[1]!==null&&String(o[1])!=='').map(o=>`<label class="lmOption"><input type="radio" name="lmq_${escLM(q.idSoal)}" value="${escLM(o[0])}"><span><b>${escLM(o[0])}.</b> ${escLM(o[1])}</span></label>`).join('')}</div></article>`}).join('')}</div><button class="lmSubmit" id="lmSubmitChallenge" onclick="lmSubmitChallenge()">✓ Kumpulkan Jawaban</button></div>`;window.LM_CURRENT_CHALLENGE={data:d,start};window.LM_CURRENT_QUESTIONS=qs;window.LM_TIMER=setInterval(()=>{const el=document.getElementById('lmTimer');if(!el)return;const sec=Math.floor((Date.now()-start)/1000);el.textContent='⏱ '+String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')},1000)}
window.lmSubmitChallenge=async function(){const qs=window.LM_CURRENT_QUESTIONS||[],answers=[];for(const q of qs){const el=document.querySelector(`input[name="lmq_${CSS.escape(String(q.idSoal))}"]:checked`);if(!el){alert('Mohon jawab semua soal terlebih dahulu.');return}answers.push({idSoal:q.idSoal,jawaban:el.value,durasiDetik:Math.floor((Date.now()-(window.LM_CURRENT_CHALLENGE?.start||Date.now()))/1000)})}const btn=document.getElementById('lmSubmitChallenge');if(btn){btn.disabled=true;btn.textContent='⏳ Menyimpan hasil...'}try{const r=await call('submitLearningChallenge',{answers});if(window.LM_TIMER)clearInterval(window.LM_TIMER);const benar=Number(r&&r.benar||0),xp=Number(r&&r.xp||0),total=answers.length,pct=total?Math.round(benar*100/total):0;root().innerHTML=`<div class="lm lmChallenge"><div class="lmCard lmResult"><div style="font-size:54px">${pct>=80?'🏆':pct>=60?'⭐':'💪'}</div><h2>Tantangan Selesai!</h2><div class="score">${pct}%</div><p>${benar} dari ${total} jawaban benar</p><h3>⭐ +${xp} XP</h3><div class="lmNotice">Badge: <b>${escLM(r.badge)}</b></div><button class="lmBtn lmPrimary" onclick="lmStudentPage()">Kembali ke Modul</button></div></div>`}catch(e){if(btn){btn.disabled=false;btn.textContent='✓ Kumpulkan Jawaban'}alert(e.message||e)}}

/* ==================== PETUGAS SOAL ==================== */
async function lmTeacherPage(){style();const c=root();c.innerHTML='<div class="lm"><div class="loading">Memuat bank soal dan modul...</div></div>';try{const [qs,mods]=await Promise.all([call('teacherListQuestions',{}),call('teacherListLearningModules')]);window.LM_TEACHER_MODULES=mods;c.innerHTML=`<div class="lm"><section class="lmHero"><h1>🧠 Bank Soal & Modul</h1><p>Kelola modul dan buat soal Literasi/Numerasi sesuai kelas sasaran.</p></section><div class="lmToolbar"><button class="lmBtn lmPrimary" onclick="lmTeacherModuleForm()">＋ Buat Modul</button><button class="lmBtn" onclick="lmTeacherForm()">＋ Buat Soal</button><button class="lmBtn" onclick="lmTeacherPage()">↻ Muat Ulang</button></div><div class="lmCard"><h3>📚 Master Modul</h3><div class="lmTableWrap"><table class="lmTable"><thead><tr><th>Jenis</th><th>Modul</th><th>Target</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${mods.map(m=>`<tr><td>${escLM(m.jenis)}</td><td><b>${escLM(m.namaModul)}</b><br><span class="lmSmall">${escLM(m.deskripsi||'')}</span></td><td>${escLM(m.targetKelas)}</td><td><span class="lmPill">${escLM(m.status)}</span></td><td><button class="lmBtn" onclick="lmToggleModule('${escLM(m.idModul)}','${m.status==='ACTIVE'?'INACTIVE':'ACTIVE'}')">${m.status==='ACTIVE'?'Nonaktifkan':'Aktifkan'}</button></td></tr>`).join('')||'<tr><td colspan="5">Belum ada modul.</td></tr>'}</tbody></table></div></div><div class="lmCard"><h3>📝 Soal</h3><div class="lmTableWrap"><table class="lmTable"><thead><tr><th>Modul</th><th>Tipe</th><th>Level</th><th>Target</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${qs.map(q=>`<tr><td><b>${escLM((mods.find(m=>m.idModul===q.idModul)||{}).namaModul||q.idModul)}</b><br><span class="lmSmall">${escLM(q.materi)}</span></td><td>${q.tipeSoal==='PG'?'Pilihan Ganda':'Benar/Salah'}</td><td>${q.level}</td><td>${escLM(q.targetKelas)}</td><td><span class="lmPill">${escLM(q.status)}</span></td><td><div class="lmActions"><button class="lmBtn" onclick="lmPublish('${escLM(q.idSoal)}')">Publikasikan</button><button class="lmBtn lmDanger" onclick="lmDelete('${escLM(q.idSoal)}')">Hapus</button></div></td></tr>`).join('')||'<tr><td colspan="6">Belum ada soal.</td></tr>'}</tbody></table></div></div></div>`}catch(e){c.innerHTML='<div class="card"><div class="notice">'+escLM(e.message||e)+'</div></div>'}}
window.lmTeacherModuleForm=async function(){try{const classes=await call('getMasterKelasForLearning'),p=APP.session.soalPermission||{},types=(p.literasi?'<option value="LITERASI">📖 Literasi</option>':'')+(p.numerasi?'<option value="NUMERASI">🔢 Numerasi</option>':'');root().innerHTML=`<div class="lm"><div class="lmCard"><h2>＋ Buat Modul</h2><div class="lmGrid"><div class="lmField"><label>Induk Modul</label><select id="lmm_jenis">${types}</select></div><div class="lmField"><label>Nama Modul</label><input id="lmm_nama" placeholder="Contoh: Literasi Informasi Digital"></div><div class="lmField lmFull"><label>Deskripsi</label><textarea id="lmm_deskripsi" placeholder="Tujuan dan gambaran modul"></textarea></div><div class="lmField"><label>Target Kelas</label><select id="lmm_target"><option value="ALL">Semua Kelas</option>${classes.map(k=>`<option value="${escLM(k.idKelas)}">${escLM(k.namaKelas)}</option>`).join('')}</select></div><div class="lmField"><label>Status</label><select id="lmm_status"><option value="ACTIVE">ACTIVE — tampil untuk siswa</option><option value="INACTIVE">INACTIVE — disimpan, tidak tampil</option></select></div></div><div class="lmActions"><button class="lmBtn lmPrimary" onclick="lmSaveModule()">Simpan Modul</button><button class="lmBtn" onclick="lmTeacherForm()">Batal</button></div></div></div>`}catch(e){alert(e.message||e)}}
window.lmSaveModule=async function(){const d={jenis:document.getElementById('lmm_jenis').value,namaModul:document.getElementById('lmm_nama').value,deskripsi:document.getElementById('lmm_deskripsi').value,targetKelas:document.getElementById('lmm_target').value,status:document.getElementById('lmm_status').value};if(!d.namaModul.trim())return alert('Nama modul wajib diisi.');try{await call('teacherSaveLearningModule',d);alert('Modul berhasil disimpan.');lmTeacherPage()}catch(e){alert(e.message||e)}}
window.lmToggleModule=async function(id,status){try{await call('teacherSetLearningModuleStatus',id,status);lmTeacherPage()}catch(e){alert(e.message||e)}}
window.lmTeacherForm=async function(){try{const [mods,classes]=await Promise.all([call('teacherListLearningModules'),call('getMasterKelasForLearning')]);window.LM_TEACHER_MODULES=mods;const p=APP.session.soalPermission||{},types=(p.literasi?'<option value="LITERASI">📖 Literasi</option>':'')+(p.numerasi?'<option value="NUMERASI">🔢 Numerasi</option>':'');root().innerHTML=`<div class="lm"><div class="lmCard"><div class="lmFormHead"><div><h2>＋ Pembuat Soal</h2><p class="lmSmall">Buat modul dari sini atau pilih modul yang sudah tersedia.</p></div><button class="lmBtn lmPrimary" onclick="lmTeacherModuleForm()">＋ Buat Modul Baru</button></div><div class="lmNotice">Pilih tipe soal. Form jawaban berubah otomatis.</div><div class="lmGrid"><div class="lmField"><label>Induk Soal</label><select id="lmt_jenis" onchange="lmFilterModules()">${types}</select></div><div class="lmField"><label>Modul</label><div class="lmInline"><select id="lmt_modul"></select><button class="lmBtn" type="button" onclick="lmTeacherModuleForm()">＋</button></div></div><div class="lmField"><label>Level</label><select id="lmt_level"><option value="1">1 — Pemula</option><option value="2">2 — Penjelajah</option><option value="3">3 — Penantang</option><option value="4">4 — Master</option><option value="5">5 — Satria</option></select></div><div class="lmField"><label>Target Kelas</label><select id="lmt_target"><option value="ALL">Semua Kelas</option>${classes.map(k=>`<option value="${escLM(k.idKelas)}">${escLM(k.namaKelas)}</option>`).join('')}</select></div><div class="lmField"><label>Materi</label><input id="lmt_materi" placeholder="Contoh: Interpretasi grafik"></div><div class="lmField"><label>Indikator</label><input id="lmt_indikator" placeholder="Kemampuan yang dilatih"></div><div class="lmField"><label>Tipe Soal</label><select id="lmt_tipe" onchange="lmRenderAnswerForm()"><option value="PG">Pilihan Ganda</option><option value="BENAR_SALAH">Benar / Salah</option></select></div><div class="lmField lmFull"><label>Stimulus</label><textarea id="lmt_stimulus" placeholder="Teks, data, tabel, grafik, atau konteks soal"></textarea></div><div class="lmField lmFull"><label>Pertanyaan</label><textarea id="lmt_pertanyaan" placeholder="Tulis pertanyaan..."></textarea></div><div id="lmAnswerArea" class="lmField lmFull"></div><div class="lmField lmFull"><label>Pembahasan</label><textarea id="lmt_pembahasan" placeholder="Jelaskan alasan jawaban agar siswa dapat belajar dari hasilnya."></textarea></div></div><div class="lmActions"><button class="lmBtn lmPrimary" onclick="lmSaveQuestion()">Simpan Draft</button><button class="lmBtn" onclick="lmTeacherPage()">Batal</button></div></div></div>`;lmFilterModules();lmRenderAnswerForm()}catch(e){alert(e.message||e)}}
window.lmFilterModules=function(){const type=document.getElementById('lmt_jenis')?.value,sel=document.getElementById('lmt_modul');if(!sel)return;sel.innerHTML=(window.LM_TEACHER_MODULES||[]).filter(m=>m.jenis===type).map(m=>`<option value="${escLM(m.idModul)}">${escLM(m.namaModul)} • ${escLM(m.targetKelas)}</option>`).join('')||'<option value="">Belum ada modul — klik ＋</option>'}
window.lmRenderAnswerForm=function(){const area=document.getElementById('lmAnswerArea'),type=document.getElementById('lmt_tipe')?.value;if(!area)return;if(type==='PG'){area.innerHTML='<div class="lmOptionGrid"><div class="lmField"><label>Option A</label><input id="lmt_a" placeholder="Pilihan A"></div><div class="lmField"><label>Option B</label><input id="lmt_b" placeholder="Pilihan B"></div><div class="lmField"><label>Option C</label><input id="lmt_c" placeholder="Pilihan C"></div><div class="lmField"><label>Option D</label><input id="lmt_d" placeholder="Pilihan D"></div><div class="lmField"><label>Option E</label><input id="lmt_e" placeholder="Pilihan E"></div><div class="lmField"><label>Jawaban Benar</label><select id="lmt_jawaban"><option value="">Pilih jawaban</option><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option></select></div></div>'}else{area.innerHTML='<div class="lmTFBox"><div class="lmField"><label>Option 1</label><input value="Benar" disabled></div><div class="lmField"><label>Option 2</label><input value="Salah" disabled></div><div class="lmField"><label>Jawaban Benar</label><select id="lmt_jawaban"><option value="">Pilih jawaban</option><option value="BENAR">Benar</option><option value="SALAH">Salah</option></select></div></div><div class="lmSmall">Tipe Benar/Salah otomatis menyediakan tepat dua pilihan.</div>'}}
window.lmSaveQuestion=async function(){const type=document.getElementById('lmt_tipe').value,d={jenis:document.getElementById('lmt_jenis').value,idModul:document.getElementById('lmt_modul').value,level:Number(document.getElementById('lmt_level').value),targetKelas:document.getElementById('lmt_target').value,materi:document.getElementById('lmt_materi').value,indikator:document.getElementById('lmt_indikator').value,tipeSoal:type,stimulus:document.getElementById('lmt_stimulus').value,pertanyaan:document.getElementById('lmt_pertanyaan').value,opsiA:document.getElementById('lmt_a')?.value||'',opsiB:document.getElementById('lmt_b')?.value||'',opsiC:document.getElementById('lmt_c')?.value||'',opsiD:document.getElementById('lmt_d')?.value||'',opsiE:document.getElementById('lmt_e')?.value||'',jawaban:document.getElementById('lmt_jawaban').value,pembahasan:document.getElementById('lmt_pembahasan').value};if(!d.idModul)return alert('Pilih atau buat Modul terlebih dahulu.');try{await call('teacherSaveQuestion',d);alert('Soal disimpan sebagai Draft.');lmTeacherForm()}catch(e){alert(e.message||e)}}
window.lmPublish=async function(id){try{await call('teacherPublishQuestion',id);lmTeacherPage()}catch(e){alert(e.message||e)}}
window.lmDelete=async function(id){if(!confirm('Hapus soal ini?'))return;try{await call('teacherDeleteQuestion',id);lmTeacherPage()}catch(e){alert(e.message||e)}}
})();
</script>
