<script>
/* SATRIA MUDA V1 — Kegiatan Belajar Mandiri */
(function(){
const LM_STYLE=`<style id="lm-v1-style">
.lm{--p:#cdb4db;--pink:#ffc8dd;--blue:#bde0fe;--sky:#a2d2ff;--ink:#493b55;--muted:#7c7083}.lm *{box-sizing:border-box}.lmHero{padding:24px;border-radius:24px;background:linear-gradient(135deg,#eadcf0,#ffc8dd 55%,#bde0fe);color:var(--ink);margin-bottom:18px}.lmHero h1{margin:0 0 7px;font-size:28px}.lmHero p{margin:0;color:#6d6175}.lmStats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}.lmStat,.lmCard{background:#fff;border:1px solid #eadfee;border-radius:20px;padding:18px;box-shadow:0 8px 24px rgba(73,59,85,.07)}.lmStat b{display:block;font-size:24px;color:var(--ink)}.lmStat span{font-size:12px;color:var(--muted)}.lmWorlds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.lmWorld{border-radius:22px;padding:20px;background:linear-gradient(135deg,#fff,#f7effa);border:1px solid #eadfee}.lmWorld.num{background:linear-gradient(135deg,#fff,#eef8ff)}.lmWorld h3{margin:0 0 5px;color:var(--ink);font-size:20px}.lmLevel{display:flex;align-items:center;justify-content:space-between;padding:12px 13px;margin-top:9px;border-radius:14px;background:#fff;border:1px solid #eadfee}.lmLevel.lock{opacity:.55}.lmLevel button,.lmBtn{border:0;border-radius:12px;padding:9px 14px;font-weight:800;color:var(--ink);background:linear-gradient(135deg,#ffc8dd,#bde0fe);cursor:pointer}.lmLevel button:disabled{cursor:not-allowed;opacity:.5}.lmSmall{font-size:12px;color:var(--muted)}.lmChallenge{max-width:820px;margin:auto}.lmQuestion{margin-top:14px}.lmQuestion h3{font-size:17px;color:var(--ink);line-height:1.5}.lmOption{display:block;width:100%;text-align:left;margin:8px 0;padding:13px 15px;border:1px solid #e5dceb;border-radius:14px;background:#fff;color:var(--ink);cursor:pointer}.lmOption.selected{background:linear-gradient(135deg,#ffc8dd,#bde0fe);border-color:#cdb4db}.lmStimulus{padding:15px;border-radius:15px;background:#faf5fb;color:#665a6d;line-height:1.6;margin:10px 0}.lmResult{text-align:center;padding:28px}.lmResult .score{font-size:52px;font-weight:900;color:var(--ink)}.lmBar{height:9px;background:#eee7f1;border-radius:99px;overflow:hidden;margin:12px 0}.lmBar i{display:block;height:100%;background:linear-gradient(90deg,#ffc8dd,#a2d2ff);border-radius:99px}.lmToolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.lmField{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.lmField label{font-weight:800;color:var(--ink);font-size:13px}.lmField input,.lmField select,.lmField textarea{width:100%;padding:11px 12px;border:1px solid #e2d7e7;border-radius:12px;font:inherit;background:#fff}.lmField textarea{min-height:100px;resize:vertical}.lmGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.lmFull{grid-column:1/-1}.lmTable{width:100%;border-collapse:collapse;font-size:12px}.lmTable th,.lmTable td{padding:9px;border-bottom:1px solid #eee6f0;text-align:left;vertical-align:top}.lmPill{display:inline-block;padding:4px 8px;border-radius:99px;background:#f3eaf6;font-size:11px;font-weight:800}.lmNotice{padding:12px;border-radius:13px;background:#f8f2fa;color:#6e6275;margin-bottom:14px}.lmActions{display:flex;gap:8px;flex-wrap:wrap}.lmDanger{background:#ffe3ea!important}.lmHidden{display:none!important}@media(max-width:700px){.lmStats{grid-template-columns:repeat(2,1fr)}.lmWorlds,.lmGrid{grid-template-columns:1fr}.lmHero h1{font-size:23px}.lmStat,.lmCard{padding:15px}}
</style>`;
function lmRoot(){return document.getElementById('content')}
function lmEnsureStyle(){if(!document.getElementById('lm-v1-style'))document.head.insertAdjacentHTML('beforeend',LM_STYLE)}
function lmCall(fn,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args))}
window.learningModulePage=function(){lmEnsureStyle();const s=APP.session||{};if(s.role==='PETUGAS_SOAL'){lmTeacherPage();return}if(s.role==='SISWA'){lmStudentPage();return}lmRoot().innerHTML='<div class="card"><div class="title">🧠 Kegiatan Belajar Mandiri</div><div class="muted">Modul latihan diperuntukkan bagi siswa dan petugas bank soal.</div></div>'}
window.modulePage=function(kode){if(kode==='BELAJAR_MANDIRI'){learningModulePage();return}const cfg=(APP.menus||[]).find(m=>m.kode===kode);if(!cfg)return;document.getElementById('content').innerHTML=`<div class="card"><div class="title">${cfg.icon} ${esc(cfg.nama)}</div><div class="muted">Isi kegiatan Anda lalu simpan. Data hanya dapat dihapus oleh pemiliknya.</div><br><div id="moduleForm"><div class="loading">Memuat formulir...</div></div><div class="actions"><button class="btn" id="saveModuleBtn" onclick="saveModule('${kode}')">Simpan ${esc(cfg.nama)}</button></div></div><div class="card"><h3>Data Saya</h3><div id="moduleTable" class="loading">Memuat...</div></div>`;loadModuleForm(kode);loadModuleData(kode)}
async function lmStudentPage(){lmEnsureStyle();const c=lmRoot();c.innerHTML='<div class="lm"><div class="loading">Memuat tantangan belajar...</div></div>';try{const d=await lmCall('getLearningDashboard');c.innerHTML=`<div class="lm"><section class="lmHero"><h1>🧠 Kegiatan Belajar Mandiri</h1><p>Tantangan Literasi & Numerasi — belajar sedikit demi sedikit, naik level, dan kumpulkan XP.</p></section><div class="lmStats"><div class="lmStat"><b>⭐ ${d.xp||0}</b><span>XP</span></div><div class="lmStat"><b>🔥 ${d.streak||0}</b><span>Streak hari</span></div><div class="lmStat"><b>✓ ${d.correct||0}</b><span>Jawaban benar</span></div><div class="lmStat"><b>${d.badge||'🎯'}</b><span>Badge</span></div></div><div class="lmCard"><h3>🎯 Pilih Tantangan</h3><p class="lmSmall">Level berikutnya terbuka setelah minimal 5 jawaban benar per tahap.</p><div class="lmWorlds">${(d.available||[]).map(x=>lmWorld(x)).join('')}</div></div></div>`}catch(e){c.innerHTML='<div class="card"><div class="notice">Gagal memuat latihan: '+esc(e.message||e)+'</div></div>'}}
function lmWorld(x){const icon=x.jenis==='LITERASI'?'📖':'🔢',title=x.jenis==='LITERASI'?'Literasi':'Numerasi',cls=x.jenis==='NUMERASI'?' num':'';return `<div class="lmWorld${cls}"><h3>${icon} ${title}</h3><div class="lmSmall">Pilih level yang sudah terbuka.</div>${(x.levels||[]).map(l=>`<div class="lmLevel ${l.unlocked?'':'lock'}"><div><b>Level ${l.level}</b><div class="lmSmall">${l.soal||0} soal aktif</div></div><button ${l.unlocked&&l.soal?'':'disabled'} onclick="startLM('${x.jenis}',${l.level})">${l.unlocked?(l.soal?'Mulai':'Kosong'):'🔒 Terkunci'}</button></div>`).join('')}</div>`}
window.startLM=async function(jenis,level){try{const d=await lmCall('startLearningChallenge',jenis,level,5);lmRenderChallenge(d)}catch(e){alert(e.message||e)}}
function lmRenderChallenge(d){const c=lmRoot(),qs=d.questions||[];c.innerHTML=`<div class="lm lmChallenge"><div class="lmCard"><div class="lmSmall">${d.jenis==='LITERASI'?'📖 Literasi':'🔢 Numerasi'} • Level ${d.level}</div><h2>🎮 Tantangan ${qs.length} Soal</h2><div class="lmBar"><i style="width:0%" id="lmProgress"></i></div><div id="lmQuestions"></div><div class="lmActions"><button class="lmBtn" id="lmSubmit" onclick="submitLM('${d.jenis}',${d.level})">Kirim Jawaban</button><button class="lmBtn" onclick="learningModulePage()">Keluar</button></div></div></div>`;window.LM_ACTIVE={...d,started:Date.now(),answers:{}};lmRenderQuestion(0)}
function lmRenderQuestion(i){const q=LM_ACTIVE.questions[i],box=document.getElementById('lmQuestions');if(!q)return;const letters=[['A',q.opsiA],['B',q.opsiB],['C',q.opsiC],['D',q.opsiD]];let options=q.tipeSoal==='BENAR_SALAH'?[['BENAR','Benar'],['SALAH','Salah']]:letters;box.innerHTML=`<div class="lmQuestion"><span class="lmPill">Soal ${i+1}/${LM_ACTIVE.questions.length}</span><h3>${esc(q.pertanyaan)}</h3>${q.stimulus?`<div class="lmStimulus">${esc(q.stimulus)}</div>`:''}${options.map(o=>`<button class="lmOption ${LM_ACTIVE.answers[q.idSoal]===o[0]?'selected':''}" onclick="pickLM('${esc(q.idSoal)}','${esc(o[0])}',${i})"><b>${esc(o[0])}</b> ${esc(o[1]||'')}</button>`).join('')}</div>`;const p=Math.round((i/LM_ACTIVE.questions.length)*100);document.getElementById('lmProgress').style.width=p+'%'}
window.pickLM=function(id,j,i){LM_ACTIVE.answers[id]=j;lmRenderQuestion(i)}
window.submitLM=async function(){const answers=LM_ACTIVE.questions.map(q=>({idSoal:q.idSoal,jawaban:LM_ACTIVE.answers[q.idSoal]||'',durasiDetik:Math.round((Date.now()-LM_ACTIVE.started)/1000)}));if(answers.some(x=>!x.jawaban))return alert('Jawab semua soal terlebih dahulu.');const b=document.getElementById('lmSubmit');b.disabled=true;b.textContent='Memeriksa...';try{const r=await lmCall('submitLearningChallenge',{answers});lmRoot().innerHTML=`<div class="lm lmChallenge"><div class="lmCard lmResult"><div style="font-size:44px">🏆</div><h2>Tantangan Selesai!</h2><div class="score">${r.skor}%</div><p>${r.benar} dari ${r.total} jawaban benar</p><h3>⭐ +${r.xp} XP</h3><div class="lmNotice">Badge: <b>${esc(r.badge)}</b></div><button class="lmBtn" onclick="learningModulePage()">Kembali ke Tantangan</button></div></div>`}catch(e){b.disabled=false;b.textContent='Kirim Jawaban';alert(e.message||e)}}
async function lmTeacherPage(){const c=lmRoot();c.innerHTML='<div class="lm"><div class="loading">Memuat bank soal...</div></div>';try{const qs=await lmCall('teacherListQuestions',{});c.innerHTML=`<div class="lm"><section class="lmHero"><h1>🧠 Bank Soal</h1><p>Kelola tantangan Literasi dan Numerasi yang akan dimainkan siswa.</p></section><div class="lmToolbar"><button class="lmBtn" onclick="lmTeacherForm()">＋ Buat Soal</button><button class="lmBtn" onclick="learningModulePage()">↻ Muat Ulang</button></div><div class="lmCard"><div class="lmTableWrap"><table class="lmTable"><thead><tr><th>Jenis</th><th>Level</th><th>Materi</th><th>Target</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${qs.map(q=>`<tr><td>${q.jenis}</td><td>${q.level}</td><td>${esc(q.materi)}</td><td>${esc(q.targetKelas)}</td><td><span class="lmPill">${esc(q.status)}</span></td><td><div class="lmActions"><button class="lmBtn" onclick="lmPublish('${q.idSoal}')">Publikasikan</button><button class="lmBtn lmDanger" onclick="lmDelete('${q.idSoal}')">Hapus</button></div></td></tr>`).join('')||'<tr><td colspan="6">Belum ada soal.</td></tr>'}</tbody></table></div></div></div>`}catch(e){c.innerHTML='<div class="card"><div class="notice">'+esc(e.message||e)+'</div></div>'}}
window.lmTeacherForm=function(){const p=APP.session.soalPermission||{};const opts=(p.literasi?'<option>LITERASI</option>':'')+(p.numerasi?'<option>NUMERASI</option>':'');lmRoot().innerHTML=`<div class="lm"><div class="lmCard"><h2>➕ Buat Soal</h2><div class="lmNotice">Gunakan stimulus kontekstual agar latihan benar-benar melatih literasi/numerasi.</div><div class="lmGrid"><div class="lmField"><label>Jenis</label><select id="lmt_jenis">${opts}</select></div><div class="lmField"><label>Level</label><select id="lmt_level"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div><div class="lmField"><label>Target Kelas</label><input id="lmt_target" placeholder="ALL atau X-1"></div><div class="lmField"><label>Materi</label><input id="lmt_materi" placeholder="Contoh: Interpretasi grafik"></div><div class="lmField"><label>Indikator</label><input id="lmt_indikator" placeholder="Kemampuan yang dilatih"></div><div class="lmField"><label>Tipe Soal</label><select id="lmt_tipe"><option value="PG">Pilihan Ganda</option><option value="BENAR_SALAH">Benar / Salah</option></select></div><div class="lmField lmFull"><label>Stimulus</label><textarea id="lmt_stimulus" placeholder="Teks, data, tabel, atau konteks soal"></textarea></div><div class="lmField lmFull"><label>Pertanyaan</label><textarea id="lmt_pertanyaan" placeholder="Tulis pertanyaan..."></textarea></div><div class="lmField"><label>Opsi A</label><input id="lmt_a"></div><div class="lmField"><label>Opsi B</label><input id="lmt_b"></div><div class="lmField"><label>Opsi C</label><input id="lmt_c"></div><div class="lmField"><label>Opsi D</label><input id="lmt_d"></div><div class="lmField"><label>Jawaban Benar</label><input id="lmt_jawaban" placeholder="A/B/C/D atau BENAR/SALAH"></div><div class="lmField"><label>Pembahasan</label><textarea id="lmt_pembahasan"></textarea></div></div><div class="lmActions"><button class="lmBtn" onclick="lmSaveQuestion()">Simpan Draft</button><button class="lmBtn" onclick="lmTeacherPage()">Batal</button></div></div></div>`}
window.lmSaveQuestion=async function(){const d={jenis:v('lmt_jenis'),level:v('lmt_level'),targetKelas:v('lmt_target'),materi:v('lmt_materi'),indikator:v('lmt_indikator'),tipeSoal:v('lmt_tipe'),stimulus:v('lmt_stimulus'),pertanyaan:v('lmt_pertanyaan'),opsiA:v('lmt_a'),opsiB:v('lmt_b'),opsiC:v('lmt_c'),opsiD:v('lmt_d'),jawaban:v('lmt_jawaban'),pembahasan:v('lmt_pembahasan')};try{await lmCall('teacherSaveQuestion',d);alert('Soal berhasil disimpan sebagai draft.');lmTeacherPage()}catch(e){alert(e.message||e)}}
window.lmPublish=async function(id){if(!confirm('Publikasikan soal ini?'))return;try{await lmCall('teacherPublishQuestion',id);lmTeacherPage()}catch(e){alert(e.message||e)}}
window.lmDelete=async function(id){if(!confirm('Hapus soal ini?'))return;try{await lmCall('teacherDeleteQuestion',id);lmTeacherPage()}catch(e){alert(e.message||e)}}
function v(id){return document.getElementById(id)?.value||''}
function esc(x){return window.esc?window.esc(x):String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
/* OWNER: tombol penugasan guru. */
function lmOwnerButton(){if((APP.session||{}).role!=='OWNER'||document.getElementById('lmOwnerNav'))return;const nav=document.getElementById('ownerNav');if(!nav)return;const b=document.createElement('button');b.id='lmOwnerNav';b.className='nav special';b.textContent='🧠 Petugas Bank Soal';b.onclick=lmOwnerPetugasPage;nav.appendChild(b)}
window.lmOwnerPetugasPage=async function(){lmEnsureStyle();const c=lmRoot();c.innerHTML='<div class="lm"><div class="loading">Memuat petugas soal...</div></div>';try{const rows=await lmCall('ownerListSoalPetugas');c.innerHTML=`<div class="lm"><div class="lmHero"><h1>🧠 Petugas Bank Soal</h1><p>OWNER menentukan guru yang boleh membuat soal Literasi dan/atau Numerasi.</p></div><div class="lmCard"><h3>＋ Tetapkan Petugas</h3><div class="lmGrid"><div class="lmField"><label>Email Guru</label><input id="lmo_email" placeholder="guru@sekolah.sch.id"></div><div class="lmField"><label>Nama Guru</label><input id="lmo_nama"></div><div class="lmField"><label>Akses</label><div><label><input type="checkbox" id="lmo_lit"> Literasi</label> &nbsp; <label><input type="checkbox" id="lmo_num"> Numerasi</label></div></div></div><button class="lmBtn" onclick="lmOwnerSave()">Simpan Petugas</button></div><div class="lmCard"><h3>Petugas Aktif</h3><table class="lmTable"><tr><th>Guru</th><th>Email</th><th>Literasi</th><th>Numerasi</th><th>Status</th><th></th></tr>${rows.map(r=>`<tr><td>${esc(r.namaGuru)}</td><td>${esc(r.email)}</td><td>${r.literasi?'✓':'-'}</td><td>${r.numerasi?'✓':'-'}</td><td>${esc(r.status)}</td><td><button class="lmBtn lmDanger" onclick="lmOwnerDelete('${esc(r.email)}')">Hapus</button></td></tr>`).join('')||'<tr><td colspan="6">Belum ada petugas.</td></tr>'}</table></div></div>`}catch(e){c.innerHTML='<div class="card"><div class="notice">'+esc(e.message||e)+'</div></div>'}}
window.lmOwnerSave=async function(){const d={email:v('lmo_email'),namaGuru:v('lmo_nama'),literasi:document.getElementById('lmo_lit').checked,numerasi:document.getElementById('lmo_num').checked};try{await lmCall('ownerSaveSoalPetugas',d);lmOwnerPetugasPage()}catch(e){alert(e.message||e)}}
window.lmOwnerDelete=async function(e){if(!confirm('Hapus petugas soal ini?'))return;try{await lmCall('ownerDeleteSoalPetugas',e);lmOwnerPetugasPage()}catch(x){alert(x.message||x)}}
const mo=new MutationObserver(()=>lmOwnerButton());mo.observe(document.body,{subtree:true,childList:true});window.addEventListener('load',()=>setTimeout(lmOwnerButton,700));
})();
</script>
